  /vaults/{vaultId}/search-results:
    get:
      tags:
        - Search
      summary: Basic Search
      description: 'Basic search: Retrieves entities using a query string. The text is searched across all properties or both properties and content based on options passed.'
      operationId: search
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/q'
        - in: query
          name: option[searchContent]
          description: |-
            ``true``: Search full content of the file.

            ``false``: (Default) Search only properties of the file.
          schema:
            type: boolean
            default: false
        - in: query
          name: option[searchSubFolders]
          description: |-
            ``true``: Search sub folders.

            ``false``: (Default) Do not search sub folders.
          schema:
            type: boolean
            default: false
        - in: query
          name: option[releasedFilesOnly]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include only versions that are consumable (released) state.

            ``false``: (Default) Include all versions.
        - in: query
          name: option[releasedItemsOnly]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include only versions that are consumable (released) state.

            ``false``: (Default) Include all versions.
        - in: query
          name: option[latestOnly]
          description: |-
            ``true``: (Default) Include only the latest version.

            ``false``: Include all versions.
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/extendedModels'
        - $ref: '#/components/parameters/propDefIds'
        - in: query
          name: sort
          description: |-
            The sorting criteria for the results. Supports multi-sort with one or more comma-separated entries.

            Each entry takes the form ``{propertyDefSysName} {sort-order}``, where ``sort-order`` is ``asc`` or ``desc``. Example: ``sort=Revision desc,Name asc``.
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The search results were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /vaults/{vaultId}:advanced-search:
    post:
      tags:
        - Search
      summary: Advanced Search
      description: |-
        Searches for entities within the specified Knowledge Vault.

        The search can be customized based on various parameters such as entity types (``File``, ``Folder``, ``Item``, ``ChangeOrder``), specific folders, and search criteria. Callers can sort the results, limit the search to the latest or released files or items only, and decide whether to include subfolders or full models in the search.

        The ``vaultId`` URI parameter identifies the targeted Knowledge Vault.
      operationId: advancedSearch
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
        - in: query
          name: option[searchSubFolders]
          description: |-
            ``true``: Search sub-folders of the folders specified in foldersToSearch in the request body.

            ``false``: (Default) Do not search sub-folders of the folders specified in foldersToSearch in the request body.

            If no folders are specified in foldersToSearch in the request body, then this parameter will not have any effect.
          schema:
            type: boolean
            default: false
        - in: query
          name: option[releasedFilesOnly]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include only versions that are consumable (released) state.

            ``false``: (Default) Include all versions.
        - in: query
          name: option[releasedItemsOnly]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include only versions that are consumable (released) state.

            ``false``: (Default) Include all versions.
        - in: query
          name: option[latestOnly]
          schema:
            type: boolean
            default: true
          description: |-
            ``true``: (Default) Include only the latest version.

            ``false``: Include all versions.
        - $ref: '#/components/parameters/extendedModels'
        - $ref: '#/components/parameters/propDefIds'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entityTypesToSearch:
                  type: array
                  uniqueItems: true
                  description: EntityTypes to search. If null or empty value is passed, it will include results from all entity types.
                  items:
                    type: string
                    enum:
                      - File
                      - Folder
                      - Item
                      - ChangeOrder
                foldersToSearch:
                  type: array
                  description: URL string array for the folder entities.
                  items:
                    type: string
                searchCriterias:
                  type: array
                  description: The search parameters.
                  items:
                    $ref: '#/components/schemas/SearchCriteria'
                sortCriterias:
                  type: array
                  description: The properties to sort on.
                  items:
                    $ref: '#/components/schemas/SortCriteria'
              required:
                - searchCriterias
            examples:
              Example 1:
                value:
                  entityTypesToSearch:
                    - Folder
                    - File
                  foldersToSearch:
                    - /AutodeskDM/Services/api/vault/v2/vaults/106/folders/1
                    - /AutodeskDM/Services/api/vault/v2/vaults/106/folders/2
                  searchCriterias:
                    - propertyDefinitionUrl: /AutodeskDM/Services/api/vault/v2/vaults/106/property-definitions/9
                      operator: Contains
                      searchString: SM-TEST-01
                    - propertyDefinitionUrl: /AutodeskDM/Services/api/vault/v2/vaults/106/property-definitions/47
                      operator: IsExactly
                      searchString: Released
                  sortCriterias:
                    - propertyDefinitionUrl: /AutodeskDM/Services/api/vault/v2/vaults/106/property-definitions/30
                      ascending: true
      responses:
        '200':
          description: The search results were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
