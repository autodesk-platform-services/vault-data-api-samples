          name: id
          description: The unique identifier of a file version.
          required: true
          schema:
            type: string
        - in: query
          name: wmSrcItemVerId
          required: false
          schema:
            type: string
          description: The item version ID to use as the watermark source. Supply this when the current file is a DWF associated with an Item and you want to download its watermarked version.
        - in: query
          name: wmSrcFileVerId
          required: false
          schema:
            type: string
          description: The file version ID (or CAD file version ID) to use as the watermark source. Supply this when the current file is a DWF associated with an Item, either directly or as a CAD file's visualization attachment, and you want to download its watermarked version.
        - in: query
          name: contentDisposition
          required: false
          schema:
            type: string
          description: |-
            The Content-Disposition header value to apply to the response.

            - ``inline``: The file is displayed inside the web page.
            - ``attachment`` (or ``null``): The file is saved as a download.

            Any other value is passed through as-is, but the resulting browser behavior is not guaranteed.
        - in: query
          name: expirationTime
          schema:
            type: integer
            default: 180
          description: 'The duration in seconds for which the signed URL remains valid. The maximum allowed value is 180 seconds. Example: ``expirationTime=120``.'
      responses:
        '200':
          description: The signed download URL was successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  url:
                    type: string
