  /vaults/{vaultId}/files/{id}/versions:
    get:
      tags:
        - Files and Folders
      summary: Get Version History for File
      description: |-
        Retrieves the version history of the specified file.

        The result depends on the combination of ``option[revision]`` and ``option[history]``:

        **When ``option[revision]`` is ``AllRevision``:**

        - ``option[history]=All`` - Returns every file version across all revisions.
        - ``option[history]=ReleasedOnly`` - Returns only file versions in a consumable (released) state.
        - ``option[history]=ReleasedAndRevisionTip`` - Returns file versions that are either the revision tip or in a consumable state.

        **When ``option[revision]`` is ``CurrentRevision``:**

        - ``option[history]=All`` - Returns every file version within the current revision.
        - ``option[history]=ReleasedOnly`` - Returns only file versions in the current revision that are in a consumable state.
        - ``option[history]=ReleasedAndRevisionTip`` - Returns file versions in the current revision that are either the revision tip or in a consumable state.
      operationId: getFileHistory
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: The unique identifier (master ID) used to group all versions of a file. Different versions of a file have different version (iteration) IDs but share the same master ID.
          required: true
          schema:
            type: string
        - in: query
          name: option[history]
          description: |-
            The scope of file versions to include in the history. Possible values:

            - ``All`` (Default) - Include every iteration in scope.
            - ``ReleasedOnly`` - Include only iterations in a consumable (released) state.
            - ``ReleasedAndRevisionTip`` - Include iterations that are either the revision tip or released.
          schema:
            $ref: '#/components/schemas/HistoryOptionsEnum'
        - in: query
          name: option[onlyShowTipReleasedForEachRev]
          description: |-
            Indicates whether only the tip released version is shown for each revision.

            ``true``: (Default) Only show the tip released version for each revision.

            ``false``: Show all released versions for each revision.

            This parameter has no effect when ``option[history]=All``.
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/extendedModels'
        - $ref: '#/components/parameters/propDefIds'
        - in: query
          name: option[revision]
          schema:
            $ref: '#/components/schemas/RevisionOptionsEnum'
          description: |-
            The revision scope for the history query. Possible values:

            - ``AllRevision`` (Default) - Include all revisions.
            - ``CurrentRevision`` - Restrict results to the current revision only.
        - in: query
          name: descending
          description: |-
            Indicates whether the latest file version is returned first.

            ``true``: Return the latest file version at the top.

            ``false``: (Default) Return the latest file version at the bottom.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The list of file versions was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersionCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
