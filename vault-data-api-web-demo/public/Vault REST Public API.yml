  /vaults/{vaultId}/file-versions/{id}/svf/bubble.json:
    get:
      tags:
        - Files and Folders
      summary: Get the LMV Root for File Version
      description: |-
        Retrieves the bubble.json file, which serves as the root file for the Autodesk Large Model Viewer (LMV) format, when the file version is DWF or DWFx. It provides essential metadata and structure information required to render 2D/3D models or other complex visualizations in the LMV viewer.

        **Note:** The first call to this operation for a given file version triggers a low-priority background job that generates the ``bubble.json`` and other LMV visualization files. The generated files are cached, and subsequent calls retrieve the ``bubble.json`` from the cache directly.

        To retrieve the associated DWF or DWFx file (if available) for a CAD file, use the **Get Visualization Attachments** operation.
      operationId: getFileVersionLmvRoot
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: The unique identifier of a file version.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/allowSync'
        - in: query
          name: wmSrcItemVerId
          required: false
          description: The item version ID to use as the watermark source. Supply this when the current file is a DWF associated with an Item and you want to download its watermarked version.
          schema:
            type: string
        - in: query
          name: wmSrcFileVerId
          required: false
          description: The file version ID (or CAD file version ID) to use as the watermark source. Supply this when the current file is a DWF associated with an Item, either directly or as a CAD file's visualization attachment, and you want to download its watermarked version.
          schema:
            type: string
      responses:
        '200':
          description: Bubble.json is retrieved from cache.
          content:
            application/json:
              schema:
                type: object
        '202':
          description: |-
            Bubble.json and other LMV files are not generated yet for this DWF/x file. ``202`` indicates the server has accepted the request and has scheduled a low priority background job to create the files required for viewing.

            Note: User could invoke this operation every x seconds in loop to check this translation job status and wait for completion till StatusCode = 200
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
    parameters:
      - schema:
          type: string
        name: vaultId
        description: The unique identifier of a Knowledge Vault.
        in: path
        required: true
      - schema:
          type: string
        name: id
        description: The unique identifier of a file version.
        in: path
        required: true
