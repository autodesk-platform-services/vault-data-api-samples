  /vaults/{vaultId}/folders/{id}/contents:
    get:
      tags:
        - Files and Folders
      summary: Get Folder Contents
      description: Retrieves the contents of the specified folder, including its child folders and entities.
      operationId: getFolderContents
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          description: The unique identifier of a folder. The reserved keyword ``root`` returns the contents of the Knowledge Vault's root folder.
          schema:
            type: string
        - $ref: '#/components/parameters/q'
        - in: query
          name: option[searchContent]
          description: |-
            ``true``: Search query text within all properties or both in all properties and content.

            ``false``: (Default) Search query text within all properties.
          schema:
            type: boolean
            default: false
        - in: query
          name: option[searchSubFolders]
          description: |-
            ``true``: Search query text within all sub folders.

            ``false``: (Default) Do not search query text within all sub folders.
          schema:
            type: boolean
            default: false
        - in: query
          name: option[includeFolders]
          schema:
            type: boolean
            default: true
          description: |-
            ``true``: (Default) Include folders or folder links in the search result.

            ``false``: Exclude folders or folder links in the search result.
        - in: query
          name: option[includeItemEcoLinks]
          schema:
            type: boolean
            default: true
          description: |-
            ``true``: (Default) Include Item/Change-order Link in the search result.

            ``false``: Exclude Item/Change-order Link in the search result.
        - in: query
          name: option[releasedFilesOnly]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include only file/file links that are in consumable (released) state.

            ``false``: (Default) Include all files/file links.
        - in: query
          name: option[releasedItemsOnly]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include only itemLink that are consumable state.

            ``false``: (Default) Include all itemLink.
        - in: query
          name: option[latestOnly]
          schema:
            type: boolean
            default: true
          description: |-
            ``true``: (Default) Include only the latest version.

            ``false``: Include all versions.
        - $ref: '#/components/parameters/extendedModels'
        - $ref: '#/components/parameters/propDefIds'
        - in: query
          name: sort
          description: |-
            The sorting criteria for the results. Supports multi-sort with one or more comma-separated entries.

            Each entry takes the form ``{propertyDefSysName} {sort-order}``, where ``sort-order`` is ``asc`` or ``desc``. Example: ``sort=Revision desc,Name asc``.
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The folder contents were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCollection'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
