    get:
      tags:
        - Items
      summary: Get Version History for Item
      description: Retrieves the version history for the specified item, filtered by ``option[history]`` and ordered by the ``descending`` parameter.
      operationId: getItemHistory
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: The unique identifier (master ID) used to group all versions of an item. Different versions of an item have different version (iteration) IDs but share the same master ID.
          required: true
          schema:
            type: string
        - in: query
          name: option[history]
          description: |-
            The scope of item versions to include in the history. Possible values:

            - ``All`` (Default) - Include every iteration in scope.
            - ``ReleasedOnly`` - Include only iterations in a consumable (released) state.
            - ``ReleasedAndRevisionTip`` - Include iterations that are either the revision tip or released.
            - ``RevisionTip`` - Include only the tip iteration for each revision.
          schema:
            $ref: '#/components/schemas/HistoryOptionsEnum'
        - $ref: '#/components/parameters/extendedModels'
        - $ref: '#/components/parameters/propDefIds'
        - in: query
          name: descending
          description: |-
            Indicates whether the latest item version is returned first.

            ``true``: Return the latest item version at the top.

            ``false``: (Default) Return the latest item version at the bottom.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
