  /vaults/{vaultId}/file-uploads/{uploadId}/parts/{partIndex}:
    put:
      tags:
        - Files and Folders
      summary: Upload File Content Part
      description: Appends one raw file-content part. Clients may use the file MIME type as Content-Type; Vault does not use this header to determine the file type. Multipart form bodies are rejected with 415 because their boundaries are not file content. Start with partIndex 0 and send the uploadSessionToken returned by each successful response in the X-Vault-Upload-Session header. The underlying Filestore upload is append-only, so clients must restart the upload after an unknown network outcome instead of replaying a part.
      operationId: uploadFileContentPart
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - in: path
          name: uploadId
          description: The stable identifier of the upload session.
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: partIndex
          description: Zero-based sequential part index.
          required: true
          schema:
            type: integer
            minimum: 0
        - in: header
          name: X-Vault-Upload-Session
          description: The opaque continuation token returned by the previous upload response.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The content part was appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadSession'
        '400':
          $ref: '#/components/responses/400'
        '411':
          description: The Content-Length header is required.
        '415':
          description: Multipart form bodies are not supported. Send the raw file bytes as the request body.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /vaults/{vaultId}/file-uploads/{uploadId}:complete:
    post:
      tags:
        - Files and Folders
      summary: Complete File Upload
      description: Completes a temporary upload and returns the server-calculated content size, checksum, and opaque UploadTicket required by subsequent file creation or check-in requests.
      operationId: completeFileUpload
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - in: path
          name: uploadId
          description: The stable identifier of the upload session.
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Vault-Upload-Session
          description: The opaque continuation token returned by the previous upload response.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The upload was completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadCompletion'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
components:
  responses:
    '400':
      description: The server was unable to process the request. The syntax of the request is malformed or the request is missing a required header. Do not repeat the request without fixing the issue. The response body may indicate what is wrong with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401':
      description: The supplied authorization header was not valid or the supplied token scope was not acceptable. Verify authentication and try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '403':
      description: The request was successfully validated but lacking the required permissions. Verify your credentials and permissions before you send this request again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '409':
      description: The request conflicts with the current Vault state, such as an item number that is already in use.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '404':
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      description: The server encountered an unexpected error while processing the request. Retry the request; if the problem persists, contact support.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CheckinFileRequest:
      title: Check In File Request
      type: object
      properties:
        uploadTicket:
          type: string
          description: Opaque completed-upload ticket containing replacement file content. Omit this value to check in without new content.
        comment:
          type: string
          description: Optional check-in comment.
        keepCheckedOut:
          type: boolean
          default: false
          description: Keeps the file checked out after a successful check-in. When no changes are detected, this leaves the current checkout unchanged.
    FileUploadSession:
      title: File Upload Session
      type: object
      description: Contains identifiers required to continue a temporary file upload.
      properties:
        uploadId:
          type: string
          format: uuid
          description: Stable identifier of the upload session.
        uploadSessionToken:
          type: string
          description: Opaque continuation token. Send this value in the X-Vault-Upload-Session header for the next part upload or completion request.
        state:
          type: string
          enum:
            - open
            - uploading
        maxPartSize:
          type: integer
          format: int64
          description: Maximum accepted size of one content part in bytes.
        totalBytes:
          type: integer
          format: int64
          description: Total content bytes successfully appended to this upload session.
    FileUploadCompletion:
      title: File Upload Completion
      type: object
      description: Contains the result of a completed temporary file upload.
      properties:
        uploadId:
          type: string
          format: uuid
          description: Stable identifier of the upload session.
        state:
          type: string
          enum:
            - completed
        size:
          type: integer
          format: int64
          description: Content size in bytes calculated by Vault.
        checksum:
          type: integer
          description: Content checksum calculated by Vault.
        uploadTicket:
          type: string
          description: Opaque UploadTicket required by a subsequent file creation or check-in request.
    Account:
      title: Account
      type: object
      description: Contains sign-in account information for Vault.
      properties:
        id:
          type: string
          description: The unique identifier of the account.
        accountName:
          type: string
          description: The name of the account for signin purposes.
        accountEmail:
          type: string
          description: The email associated with the account.
        isActive:
          type: boolean
          description: |-
            ``true``: The account is active (enabled).

            ``false``: The account is inactive (disabled).
        url:
          description: The relative URL to access this account.
          allOf:
            - $ref: '#/components/schemas/Url'
    AccountCollection:
      title: Account Collection
      type: object
      description: Contains pagination metadata and an array of accounts.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of accounts.
          items:
            $ref: '#/components/schemas/Account'
    AuthTypeEnum:
      title: AuthType Enum
      type: string
      enum:
        - ActiveDirectory
        - Vault
        - Autodesk
      description: |-
        Specifies which account directory backs the sign-in record. Possible values:

        - ``ActiveDirectory`` - Account is linked to Active Directory.
        - ``Vault`` - Account is native to Vault.
        - ``Autodesk`` - Account is linked to Autodesk ID.
    BOMComponent:
      title: BOM Component
      type: object
      description: Contains a row in an item bill of materials (BOM).
      properties:
        isCloaked:
          type: boolean
          description: |-
            Indicates whether this BOM component is cloaked.

            ``true``: This BOM component is cloaked.

            ``false``: This BOM component is not cloaked.
        bOMStructure:
          description: The BOM structure classification for this component.
          allOf:
            - $ref: '#/components/schemas/BOMStructureEnum'
        baseQty:
          type: string
          description: |-
            The numeric quantity of a single instance of the component.

            For components with discrete quantities, use ``1``. For measured quantities, use a positive decimal value. For example, a rod cut to 3.5 feet would have a ``baseUOM`` of ``foot`` and a ``baseQty`` of ``3.5``.
        baseUOM:
          type: string
          description: |-
            The unit of measure used to quantify this component.

            For discrete quantities, use ``Each``. For measured quantities, use a length unit (inch, cm, foot), a volume unit (ounce, ml, liter, quart), or a mass unit (gram, pound, kg).
        componentType:
          description: The component type for this BOM component.
          allOf:
            - $ref: '#/components/schemas/ComponentTypeEnum'
        name:
          type: string
          description: The name of this component.
        xRefType:
          description: The cross-reference type for this BOM component.
          allOf:
            - $ref: '#/components/schemas/XRefTypeEnum'
        uniqueId:
          type: string
          description: |-
            The unique identifier of the component within the scope of its design file.

            For Inventor files, this is the GUID used to identify the component (or the GUID plus ``VirtualComponentDefinition._PropertySetsId`` for virtual components). For DWG files, this is the HandleID associated with the component.
        id:
          type: string
          description: The unique identifier of this BOM component.
        xRefId:
          type: string
          description: For Components with a XRefType of "external", XRefID represents the FileID of the design file associated with that component. For "internal" Components, XRefID should be set to -1.
    BOMLinksAndRevisions:
      title: BOM Links And Revisions
      type: object
      description: Contains BOM-related links between items together with occurrences and BOM components for the retrieved structure.
      properties:
        itemVersions:
          type: array
          description: An array of item versions referenced by this BOM structure.
          items:
            $ref: '#/components/schemas/ItemVersion'
        itemBomLinks:
          type: array
          description: An array of BOM links describing the parent-child relationships between items.
          items:
            $ref: '#/components/schemas/ItemBomLink'
        referenceDesignatorsAvailable:
          type: boolean
          description: |-
            Indicates whether reference designators are available.

            ``true``: Reference designators are available.

            ``false``: Reference designators are not available.
        occurrences:
          type: array
          description: An array of occurrences.
          items:
            $ref: '#/components/schemas/ItemBomOccurrence'
        bOMComponents:
          type: array
          description: An array of BOM components in this BOM.
          items:
            $ref: '#/components/schemas/BOMComponent'
    BOMStructureEnum:
      title: BOM Structure Enum
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
      description: |-
        An enumerated value representing the BOM structure of a component. Possible values:

        - ``0`` - Normal
        - ``1`` - Purchased
        - ``2`` - Inseparable
        - ``3`` - Phantom
        - ``4`` - Reference
        - ``5`` - DynamicPhantom
    BOMTypeEnum:
      title: BOM Type Enum
      type: string
      enum:
        - Effective
        - Historic
        - Latest
        - Tip
      description: |-
        Specifies which BOM snapshot to return. Possible values:

        - ``Effective`` - Use the BOM that was effective for a given date (supply ``option[date]`` to specify the date).
        - ``Historic`` - Use a historic BOM view (see the operation's date or history parameters when applicable).
        - ``Latest`` (Default) - Use the latest BOM view.
        - ``Tip`` - Use the tip BOM view.
    ChangeOrder:
      title: Change Order
      type: object
      description: Contains core change order metadata and properties returned by the API.
      properties:
        id:
          type: string
          description: The unique identifier (master ID) of this Change Order.
        url:
          description: The relative URL to access this Change Order.
          allOf:
            - $ref: '#/components/schemas/Url'
        name:
          type: string
          description: The descriptive name of this Change Order. This value is the Change Order number.
        createDate:
          type: string
          format: date-time
          description: The date and time when the Change Order was created.
        number:
          type: string
          description: The Change Order number. Numbers are generated based on the configured numbering scheme.
        title:
          type: string
          description: The title of the Change Order.
        description:
          type: string
          description: The description of the Change Order.
        approveDeadline:
          type: string
          format: date-time
          description: The date and time by which the Change Order must be approved.
        lastModifiedDate:
          type: string
          format: date-time
          description: The date and time when the Change Order was last modified.
        lastModifiedUserId:
          type: string
          description: The unique identifier of the user who last modified the Change Order.
        closeDate:
          type: string
          format: date-time
          description: The date and time when the Change Order was closed.
        lastTouchedDate:
          type: string
          format: date-time
          description: The date and time when the Change Order was last touched (modified or interacted with).
        entityType:
          type: string
          description: The type of entity represented by this Change Order.
        numberOfAttachments:
          type: number
          description: The number of file attachments on this Change Order.
        properties:
          type: array
          description: An array of property values for this Change Order.
          items:
            $ref: '#/components/schemas/Property'
        state:
          type: string
          description: The name of the Change Order's lifecycle state.
        stateColor:
          type: number
          description: The color of the state.
        isReadOnly:
          type: boolean
          description: |-
            Indicates whether the Change Order is currently locked.

            ``true``: The Change Order is locked.

            ``false``: The Change Order is not locked.
    ChangeOrderExtended:
      title: Change Order Extended
      type: object
      description: Contains extended change order details, including assignees, in addition to core change order fields.
      allOf:
        - $ref: '#/components/schemas/ChangeOrder'
        - type: object
          properties:
            assignees:
              type: array
              items:
                $ref: '#/components/schemas/User'
    ChangeOrderCollection:
      title: Change Order Collection
      type: object
      description: Contains pagination metadata and change order results, including optional inlined property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of change orders.
          items:
            oneOf:
              - $ref: '#/components/schemas/ChangeOrderExtended'
              - $ref: '#/components/schemas/ChangeOrder'
        included:
          type: object
          description: Contains additional resources included with the change order results.
          properties:
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    ComponentTypeEnum:
      title: Component Type Enum
      type: integer
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      description: |-
        Specifies the CAD or business role of the BOM component. Possible values:

        - ``1`` - Part
        - ``2`` - Assembly
        - ``3`` - Virtual
        - ``4`` - Standard
        - ``5`` - Purchased
        - ``6`` - Document
    CursorBasedPagination:
      title: Cursor-based pagination
      type: object
      description: Contains pagination metadata for navigating through large result sets.
      properties:
        limit:
          type: integer
          description: The maximum number of results that can be returned in this response. The actual number of results may be fewer due to filtering, data availability, or other constraints. This reflects the limit value applied by the server, which may differ from the requested limit.
        totalResults:
          type: integer
          description: The total number of results available across all pages that match the query criteria, regardless of pagination limits.
        indexingStatus:
          description: The indexing status for the current query scope.
          allOf:
            - $ref: '#/components/schemas/IndexingStatus'
        nextUrl:
          type: string
          description: The URL used to retrieve the next page of results. The URL includes an embedded cursor token for the subsequent call. When ``null`` or absent, this is the final page. Note that a page may be empty but still include a next page URL. Continue paging until this attribute is ``null`` or absent.
    ECOComment:
      title: ECO Comment
      type: object
      description: |-
        Contains a change order comment, including threaded replies and the parent comment when applicable.

        Replies and the parent comment are returned as ``ECOCommentNode`` entries, which mirror the fields of this schema. Together, the two schemas describe one level of recursion in the comment thread.
      properties:
        id:
          type: string
          description: The unique identifier of the comment.
        url:
          description: The relative URL to access this comment.
          allOf:
            - $ref: '#/components/schemas/Url'
        subject:
          type: string
          description: The subject line of the comment.
        message:
          type: string
          description: The message body of the comment.
        createDate:
          type: string
          format: date-time
          description: The date and time when the comment was created.
        createUserName:
          type: string
          description: The user name of the comment author.
        state:
          type: string
          description: The current state of the comment.
        numberOfAttachments:
          type: number
          description: The number of attachments on the comment.
        replies:
          type: array
          description: An array of reply comments.
          items:
            $ref: '#/components/schemas/ECOCommentNode'
        parent:
          description: The parent comment node for this comment.
          allOf:
            - $ref: '#/components/schemas/ECOCommentNode'
    ECOCommentNode:
      title: ECO Comment Node
      type: object
      description: Contains a parent or reply node referenced from an ``ECOComment``. This schema mirrors the fields of ``ECOComment`` and exists separately to break the recursive ``replies`` and ``parent`` reference cycle in OpenAPI.
      properties:
        id:
          type: string
          description: The unique identifier of the comment.
        url:
          description: The relative URL to access this comment.
          allOf:
            - $ref: '#/components/schemas/Url'
        subject:
          type: string
          description: The subject line of the comment.
        message:
          type: string
          description: The message body of the comment.
        createDate:
          type: string
          format: date-time
          description: The date and time when the comment was created.
        createUserName:
          type: string
          description: The user name of the comment author.
        state:
          type: string
          description: The current state of the comment.
        numberOfAttachments:
          type: number
          description: The number of attachments on the comment.
        replies:
          type: array
          description: An array of reply comments.
          items:
            $ref: '#/components/schemas/ECOComment'
        parent:
          description: The parent comment node for this comment.
          allOf:
            - $ref: '#/components/schemas/ECOComment'
    ECOCommentCollection:
      title: ECO Comment Collection
      type: object
      description: Contains pagination metadata and an array of change order comments.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of change order comments.
          items:
            $ref: '#/components/schemas/ECOComment'
    Entity:
      title: Entity
      type: object
      description: Contains a generic entity representation with every field the API supports for mixed search results.
      properties:
        id:
          type: string
          description: The unique identifier of the entity.
        name:
          type: string
          description: The name of the entity.
        fullName:
          type: string
          description: The full Vault path of this entity when it is a folder.
        number:
          type: string
          description: The entity number when this entity type supports numbering.
        category:
          type: string
          description: The category assigned to this entity.
        categoryColor:
          type: number
          description: The color of the category.
        entityType:
          type: string
          description: The type of entity represented by this result.
        version:
          type: number
          description: The version number when the entity is an iteration object.
        createDate:
          type: string
          format: date-time
          description: The date and time when this version of the entity was created in the Vault.
        lastModifiedDate:
          type: string
          format: date-time
          description: The date and time when this entity was last modified.
        revision:
          type: string
          description: The revision label for this entity.
        state:
          type: string
          description: The name of the lifecycle state for the entity.
        stateColor:
          type: number
          description: The color of the state.
        parentFolderId:
          type: string
          description: The unique identifier of the parent folder.
        parent:
          description: The parent folder of this entity.
          allOf:
            - $ref: '#/components/schemas/Folder'
        isCheckedOut:
          type: boolean
          description: |-
            Indicates whether the latest version of this entity is checked out.

            ``true``: The latest version is checked out.

            ``false``: The latest version is not checked out.
        createUserName:
          type: string
          description: The user name of the user who created this entity version.
        checkinDate:
          type: string
          format: date-time
          description: The date and time when this entity was checked in.
        checkoutDate:
          type: string
          format: date-time
          description: The date and time when this entity was checked out.
        size:
          type: number
          description: The size of the entity content in bytes.
        url:
          description: The relative URL to access this entity.
          allOf:
            - $ref: '#/components/schemas/Url'
        hasVisualizationAttachment:
          type: boolean
          description: |-
            Indicates whether a visualization attachment is available for this entity.

            ``true``: A visualization attachment is available.

            ``false``: A visualization attachment is not available.
        checkoutUserName:
          type: string
          description: The user name of the user who currently has this entity checked out.
        isLibrary:
          type: boolean
          description: |-
            Indicates whether this entity belongs to a library.

            ``true``: This entity belongs to a library.

            ``false``: This entity does not belong to a library.
        isReadOnly:
          type: boolean
          description: |-
            Indicates whether this entity is read-only for the current user.

            ``true``: This entity is read-only.

            ``false``: This entity is editable.
        isCloaked:
          type: boolean
          description: |-
            Indicates whether this entity is cloaked.

            ``true``: This entity is cloaked.

            ``false``: This entity is not cloaked.
        file:
          description: The file object associated with this entity.
          allOf:
            - $ref: '#/components/schemas/FileObject'
        item:
          description: The item object associated with this entity.
          allOf:
            - $ref: '#/components/schemas/Item'
        subfolderCount:
          type: number
          description: The number of immediate subfolders.
        children:
          type: string
          description: The URI to retrieve child entities.
        properties:
          type: array
          description: An array of property values for this entity.
          items:
            $ref: '#/components/schemas/Property'
      required:
        - id
        - name
    EntityCollection:
      title: Entity Collection
      type: object
      description: Contains pagination metadata and heterogeneous entity results, with optional inlined folders and property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of entities.
          items:
            anyOf:
              - $ref: '#/components/schemas/FileVersion'
              - $ref: '#/components/schemas/FileVersionExtended'
              - $ref: '#/components/schemas/Folder'
              - $ref: '#/components/schemas/FolderExtended'
              - $ref: '#/components/schemas/ChangeOrder'
              - $ref: '#/components/schemas/ChangeOrderExtended'
              - $ref: '#/components/schemas/LinkEntity'
              - $ref: '#/components/schemas/ItemVersion'
        included:
          type: object
          description: Contains additional resources included with the entity results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    ErrorResponse:
      title: Error Response
      required:
        - title
        - detail
        - errorCode
        - statusCode
      type: object
      properties:
        title:
          type: string
          description: The short title of the error.
        detail:
          type: string
          description: The detailed human-readable error message.
        statusCode:
          type: integer
          description: The HTTP status code returned by the API.
        errorCode:
          type: string
          description: The Vault error code. The client can use this value to look up the localized error message.
        params:
          type: array
          description: Additional parameter values associated with the error details.
          items:
            type: string
      description: Specifies the fields returned in a Vault REST API error response.
    ExtSyncInfo:
      title: External Sync Info
      type: object
      description: Contains synchronization metadata persisted on a Vault entity when integrating with external systems. When multi-location mapping is used, ``syncMappingId`` identifies which sync target the entry belongs to.
      properties:
        id:
          type: string
          description: A unique identifier for the external sync info entry.
        parentId:
          type: string
          description: The identifier of the parent entity where this entry is stored.
        name:
          type: string
          description: The name of the external sync info entry.
        value:
          type: string
          description: |-
            The value of the external sync info entry.

            When ``name`` is ``Adsk.FusionManage.Status``, ``value`` is a numeric status code:

            - ``0``: Unknown
            - ``1``: Succeeded
            - ``2``: Failed
            - ``3``: PartiallySucceeded
            - ``4``: Skipped
        syncMappingId:
          type: string
          nullable: true
          description: The sync mapping ID identifying the sync target this entry belongs to. Null when the entry is stored in the base namespace (single-target mode).
        createDateTime:
          type: string
          format: date-time
          description: The creation date and time of the external sync info entry.
        url:
          description: The relative URL to access this external sync info entry.
          allOf:
            - $ref: '#/components/schemas/Url'
    ExtSyncInfoCollection:
      title: External Sync Info Collection
      type: object
      description: Contains a collection of external sync info entries.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of external sync info entries.
          items:
            $ref: '#/components/schemas/ExtSyncInfo'
    EntityAttribute:
      title: Entity Attribute
      type: object
      description: A custom attribute stored on a Vault entity.
      properties:
        entityId:
          type: string
          description: The unique identifier of the entity the attribute is stored on.
        namespace:
          type: string
          description: The namespace containing the attribute.
        attribute:
          type: string
          description: The attribute name.
        value:
          type: string
          nullable: true
          description: The attribute value. This value is null when the attribute is cloaked or cleared.
        isCloaked:
          type: boolean
          readOnly: true
          description: Indicates whether the attribute value is hidden because the caller does not have access to the owning entity.
      required:
        - attribute
        - isCloaked
    ExtSyncTask:
      title: External Sync Task
      type: object
      description: Contains an external sync task used to synchronize data between Vault and external systems.
      properties:
        id:
          type: string
          description: A unique identifier for the external sync task.
        vaultId:
          type: integer
          format: int64
          description: The unique identifier of the Knowledge Vault this task belongs to.
        userId:
          type: integer
          format: int64
          description: The ID of the user who created this task.
        createDate:
          type: string
          format: date-time
          description: The date and time when the task was created.
        params:
          type: object
          additionalProperties:
            type: string
          description: A dictionary of parameters that provides metadata about the external sync task. It mainly carries extra key-value data used to pass business-related additional information along the task execution chain.
        status:
          description: The current status of this external sync task.
          allOf:
            - $ref: '#/components/schemas/ExtSyncTaskStatusEnum'
        entityId:
          type: string
          description: The ID of the entity (file, item, etc.) being synchronized.
        entityClassId:
          type: string
          description: The class ID of the entity being synchronized. The value should be from EntityClass, e.g., FILE, ITEM, CO.
        configId:
          type: string
          description: The ID of the external sync configuration being used. This value comes from the key of ``GET /vaults/{vaultId}/vault-options/ext-sync-configs`` response.
        workflowType:
          type: string
          description: The type of workflow for this sync task. This value comes from the selected configuration content returned by ``GET /vaults/{vaultId}/vault-options/ext-sync-configs``.
        description:
          type: string
          description: A description of the external sync task.
        executeImmediately:
          type: boolean
          description: |-
            Indicates whether to notify the agent immediately when the task is created.

            ``true``: Notify the agent immediately when the task is created.

            ``false``: Do not notify the agent immediately when the task is created.
        predecessorTaskId:
          type: string
          description: The ID of the predecessor task that must complete before this task can run.
        url:
          description: The relative URL to access this external sync task.
          allOf:
            - $ref: '#/components/schemas/Url'
    CreateExtSyncTaskRequest:
      title: Create External Sync Task Request
      type: object
      description: Contains the request body for creating a single external sync task.
      properties:
        entityId:
          type: string
          description: The ID of the entity (file, item, etc.) being synchronized.
        entityClassId:
          type: string
          description: The class ID of the entity being synchronized. The value should be from EntityClass, e.g., FILE, ITEM, CO.
        configId:
          type: string
          description: The ID of the external sync configuration being used. This value comes from the key of ``GET /vaults/{vaultId}/vault-options/ext-sync-configs`` response.
        workflowType:
          type: string
          description: The type of workflow for this sync task. This value comes from the selected configuration content returned by ``GET /vaults/{vaultId}/vault-options/ext-sync-configs``.
        description:
          type: string
          description: A description of the external sync task.
        params:
          type: object
          additionalProperties:
            type: string
          description: A dictionary of parameters that provides metadata about the external sync task. It mainly carries extra key-value data used to pass business-related additional information along the task execution chain.
        executeImmediately:
          x-private: true
          type: boolean
          description: |-
            Indicates whether to notify the agent immediately when the task is created.

            ``true``: Notify the agent immediately when the task is created.

            ``false``: Do not notify the agent immediately when the task is created.
        predecessorTaskId:
          type: string
          description: The ID of the predecessor task that must complete before this task can run.
      required:
        - entityId
        - entityClassId
        - configId
        - workflowType
        - description
    ExtSyncTaskCollection:
      title: External Sync Task Collection
      type: object
      description: Contains a collection of external sync tasks.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of external sync tasks.
          items:
            $ref: '#/components/schemas/ExtSyncTask'
    FindExtSyncTasksByEntityIdsRequest:
      title: Find External Sync Tasks By Entity IDs Request
      type: object
      description: Contains the request body for finding external sync tasks by entity IDs.
      properties:
        entityIds:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            pattern: .*\S.*
          description: An array of entity IDs to search for. At least one non-whitespace value is required.
        workflowType:
          type: string
          description: Optional workflow type to filter the results.
      required:
        - entityIds
    ExtSyncTaskStatusEnum:
      title: External Sync Task Status Enum
      type: string
      enum:
        - Ready
        - Running
        - Success
        - Failure
        - Suspended
      description: |-
        The status of the external sync task. Possible values:

        - ``Ready`` - The task is ready to be processed.
        - ``Running`` - The task is currently being processed.
        - ``Success`` - The task has completed successfully.
        - ``Failure`` - The task has failed.
        - ``Suspended`` - The task has been suspended.
    FileAssocCollection:
      title: File Association Collection
      type: object
      description: Contains pagination metadata and file-to-file associations, with optional inlined folders and property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of file associations.
          items:
            $ref: '#/components/schemas/FileAssociation'
        included:
          type: object
          description: Contains additional resources included with the file association results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    FileAssociation:
      title: File Association
      type: object
      description: Contains parent and child file versions for a dependency or attachment association.
      properties:
        parentFile:
          description: The parent file version in this association.
          allOf:
            - $ref: '#/components/schemas/FileVersionExtended'
        childFile:
          description: The child file version in this association.
          allOf:
            - $ref: '#/components/schemas/FileVersionExtended'
        fileAssocType:
          description: The association type between the parent and child file versions.
          allOf:
            - $ref: '#/components/schemas/FileAssociationTypeEnum'
        refId:
          type: string
          nullable: true
          description: Per-association reference identifier for the child in the context of the parent (for example, a CAD application handle).
    FileAssociationTypeEnum:
      title: File Association Type Enum
      type: string
      enum:
        - Dependency
        - Attachment
      description: |-
        Classifies how two file versions relate. Possible values:

        - ``Dependency`` - The child file is a dependent design reference.
        - ``Attachment`` - The child file is an attachment to the parent.
    FileVersionCollection:
      title: File Version Collection
      type: object
      description: Contains pagination metadata and file version rows, with optional inlined folders and property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of file versions.
          items:
            oneOf:
              - $ref: '#/components/schemas/FileVersionExtended'
              - $ref: '#/components/schemas/FileVersion'
        included:
          type: object
          description: Contains additional resources included with the file version results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    FileVersionResults:
      title: File Version Results
      type: object
      description: Contains file version rows without pagination, with optional inlined folders and property definitions.
      properties:
        results:
          type: array
          description: An array of file versions.
          items:
            oneOf:
              - $ref: '#/components/schemas/FileVersionExtended'
              - $ref: '#/components/schemas/FileVersion'
        included:
          type: object
          description: Contains additional resources included with the file version results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    FileObject:
      title: File
      type: object
      description: Contains the Vault file master identity and referenced file version.
      properties:
        id:
          type: string
          description: The unique identifier (master ID) of the file.
        url:
          description: The relative URL to access this file.
          allOf:
            - $ref: '#/components/schemas/Url'
        versionType:
          description: The version type of the referenced file version.
          allOf:
            - $ref: '#/components/schemas/VersionTypeEnum'
        fileVersion:
          description: The referenced file version details.
          allOf:
            - $ref: '#/components/schemas/FileVersionExtended'
      required:
        - id
        - url
    FileClassificationEnum:
      title: File Classification Enum
      type: string
      enum:
        - None
        - DesignVisualization
        - DesignDocument
        - ConfigurationMember
        - ConfigurationFactory
        - ElectricalProject
        - DesignSubstitute
        - DesignRepresentation
        - DesignPresentation
      description: |-
        The Vault classification for the file master. Possible values:

        - ``None`` - No specialized classification.
        - ``DesignVisualization`` - Design visualization asset (for example, DWF).
        - ``DesignDocument`` - Primary design document.
        - ``ConfigurationMember`` - Member of a configuration.
        - ``ConfigurationFactory`` - Factory configuration asset.
        - ``ElectricalProject`` - Electrical project content.
        - ``DesignSubstitute`` - Substitute component representation.
        - ``DesignRepresentation`` - Alternate design representation.
        - ``DesignPresentation`` - Presentation-oriented design content.
    FileVisualizationAttachmentStatusEnum:
      title: File Visualization Attachment Status Enum
      type: string
      enum:
        - None
        - Syncronized
        - NotSyncronized
        - UserVerified
        - Legacy
      description: |-
        The synchronization state of design visualization attachments. Possible values:

        - ``None`` - No visualization attachment status applies.
        - ``Syncronized`` - Visualization is synchronized with the CAD source (wire spelling as returned by Vault).
        - ``NotSyncronized`` - Visualization is not synchronized.
        - ``UserVerified`` - A user verified the visualization attachment.
        - ``Legacy`` - Legacy visualization attachment record.
    FileVersion:
      title: File Version
      type: object
      description: Contains standard file iteration metadata returned by Vault.
      properties:
        id:
          type: string
          description: The unique identifier (iteration ID) of the file version.
        name:
          type: string
          description: The name of the file. This value applies to all versions of the file.
        category:
          type: string
          description: The category assigned to this file.
        categoryColor:
          type: number
          description: The color of the category.
        classification:
          description: The classification assigned to this file.
          allOf:
            - $ref: '#/components/schemas/FileClassificationEnum'
        entityType:
          type: string
          description: The type of entity represented by this file version.
        version:
          type: number
          description: The sequential version number of the file. A file that has just been added to the Vault has a version of ``1``.
        createDate:
          type: string
          format: date-time
          description: The date and time when this version of the file was created in the Vault. For the first version of a file, this matches the check-in date. For later versions, this is the time when the previous version was checked out.
        lastModifiedDate:
          type: string
          format: date-time
          description: The last modified date of the file. This value is set by the client that uploaded the file.
        revision:
          type: string
          description: The revision label for this file.
        state:
          type: string
          description: The name of the lifecycle state for this file version.
        stateColor:
          type: number
          description: The color of the lifecycle state.
        parentFolderId:
          type: string
          description: The unique identifier of the parent folder containing this file.
        file:
          description: The file master object for this file version.
          allOf:
            - $ref: '#/components/schemas/FileObject'
        parent:
          description: The parent folder containing this file version.
          allOf:
            - $ref: '#/components/schemas/Folder'
        isCheckedOut:
          type: boolean
          description: |-
            Indicates whether the latest version of this file is in the checked-out state.

            ``true``: The latest file version is checked out.

            ``false``: The latest file version is not checked out.
        createUserName:
          type: string
          description: The Name of the user who checked-in or uploaded this file.
        checkinDate:
          type: string
          format: date-time
          description: The date and time that the file was checked in. This property is only valid if isCheckedOut is false.
        checkoutDate:
          type: string
          format: date-time
          description: The date and time when the file was last checked out.
        checkoutUserName:
          type: string
          description: The user name of the user who currently has the file checked out.
        size:
          type: number
          description: The size, in bytes, of the file. This property is only valid if isCheckedOut is false.
        url:
          description: The relative URL to access this file version.
          allOf:
            - $ref: '#/components/schemas/Url'
        hasVisualizationAttachment:
          type: boolean
          description: |-
            Indicates whether a valid visualization attachment status is available (value is not ``None``).

            ``true``: A valid visualization attachment status is available.

            ``false``: A valid visualization attachment status is not available.
        visualizationAttachmentStatus:
          description: The visualization attachment status for this file version.
          allOf:
            - $ref: '#/components/schemas/FileVisualizationAttachmentStatusEnum'
        isReadOnly:
          type: boolean
          description: |-
            Indicates whether this file is read-only for the current user.

            ``true``: This file is read-only.

            ``false``: This file is editable.
        isCloaked:
          type: boolean
          description: |-
            Indicates whether this file is cloaked. A cloaked object is one that the caller does not have permissions to view.

            ``true``: This file is cloaked.

            ``false``: This file is not cloaked.
        isOnSite:
          type: boolean
          description: |-
            Indicates whether the file is on the local site (in a multi-site environment). This value is always ``true`` in a single-site environment.

            ``true``: The file is on the local site.

            ``false``: The file is not on the local site.
        properties:
          type: array
          description: An array of property values for this file version.
          items:
            $ref: '#/components/schemas/Property'
      required:
        - id
        - name
    FileVersionExtended:
      title: File Version Extended
      type: object
      description: Contains extended file version metadata including checkout user and lifecycle state.
      allOf:
        - $ref: '#/components/schemas/FileVersion'
        - type: object
      properties:
        checkoutUser:
          description: The user who currently has this file version checked out.
          allOf:
            - $ref: '#/components/schemas/User'
        lifecycleState:
          description: The lifecycle state of this file version.
          allOf:
            - $ref: '#/components/schemas/LifecycleState'
    FolderCollection:
      title: Folder Collection
      type: object
      description: Contains pagination metadata and folder rows, with optional inlined folders and property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of folders.
          items:
            oneOf:
              - $ref: '#/components/schemas/Folder'
              - $ref: '#/components/schemas/FolderExtended'
        included:
          type: object
          description: Contains additional resources included with the folder results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    FolderResults:
      title: Folder Results
      type: object
      description: Contains folder rows without pagination, with optional inlined folders and property definitions.
      properties:
        results:
          type: array
          description: An array of folders.
          items:
            oneOf:
              - $ref: '#/components/schemas/Folder'
              - $ref: '#/components/schemas/FolderExtended'
        included:
          type: object
          description: Contains additional resources included with the folder results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    Folder:
      title: Folder
      type: object
      description: Contains standard folder metadata returned by Vault.
      properties:
        id:
          type: string
          readOnly: true
          description: The unique identifier of this folder.
        url:
          description: The relative URL to access this folder.
          allOf:
            - $ref: '#/components/schemas/Url'
        name:
          type: string
          description: The descriptive name of this folder. This is the folder name without the full path.
        fullName:
          type: string
          readOnly: true
          description: The full Vault path for this folder (for example, ``$/Folder1``).
        createDate:
          type: string
          format: date-time
          description: The date and time when the folder was created.
        createUserName:
          type: string
          description: The name of the user who created this folder.
        category:
          type: string
          description: The category assigned to this folder.
        categoryColor:
          type: number
          description: The color of the category.
        categoryId:
          type: string
          writeOnly: true
          description: On create, the id of the category to assign to the new folder. Defaults to the server's default folder category when omitted. Not populated when reading an existing folder; use ``category`` instead.
        state:
          type: string
          readOnly: true
          description: The name of the lifecycle state for this folder.
        stateColor:
          type: number
          description: The color of the lifecycle state.
        subfolderCount:
          type: number
          readOnly: true
          description: The number of immediate child folders.
        children:
          type: string
          description: The URI to retrieve child folders.
        parentFolderId:
          type: string
          description: The Vault folder id of the parent folder. On create, also accepts the reserved alias ``root`` (case-insensitive) for the vault root folder; required when creating a folder. Populated when reading an existing folder.
        isLibrary:
          type: boolean
          description: |-
            Indicates whether this folder is a library folder. On create, defaults to ``false`` when omitted; this value must match the parent folder's library status or the request fails, except for a folder created directly under the vault root, which may opt into ``isLibrary: true`` regardless of the root's own library status.

            ``true``: This folder is a library folder.

            ``false``: This folder is not a library folder.
        isReadOnly:
          type: boolean
          readOnly: true
          description: |-
            Indicates whether this folder can be modified by the logged-in user.

            ``true``: This folder is read-only for the logged-in user.

            ``false``: This folder can be modified by the logged-in user.
        isCloaked:
          type: boolean
          readOnly: true
          description: |-
            Indicates whether this folder is cloaked. A cloaked object is one that the caller does not have permissions to view.

            ``true``: This folder is cloaked.

            ``false``: This folder is not cloaked.
        properties:
          type: array
          description: An array of property values for this folder.
          items:
            $ref: '#/components/schemas/Property'
    FolderExtended:
      title: Folder Extended
      type: object
      description: Contains extended folder metadata such as parent folder and lifecycle state.
      allOf:
        - $ref: '#/components/schemas/Folder'
        - type: object
      properties:
        parentFolderId:
          type: string
          description: The unique identifier of the parent folder.
        parent:
          description: The parent folder of this folder.
          allOf:
            - $ref: '#/components/schemas/Folder'
        lifecycleState:
          description: The lifecycle state of this folder.
          allOf:
            - $ref: '#/components/schemas/LifecycleState'
    Group:
      title: Group
      type: object
      description: Contains a Vault security group. A group is a collection of users and other groups.
      properties:
        id:
          type: string
          description: The identifier for the object.
        name:
          type: string
          description: The unique name of the Group.
        systemName:
          type: string
          description: The internal system name of the group.
        authTypes:
          description: The authentication types available for this group.
          allOf:
            - $ref: '#/components/schemas/AuthTypeEnum'
        createDate:
          type: string
          format: date-time
          description: The date the Group was created.
        emailDL:
          type: string
          description: The email address (distribution list) for the Group.
        isActive:
          type: boolean
          description: |-
            Indicates whether this group is active.

            ``true``: The group is active.

            ``false``: The group is inactive.
        url:
          description: The relative URL to access this group.
          allOf:
            - $ref: '#/components/schemas/Url'
    GroupExtended:
      title: Group Extended
      type: object
      description: Contains extended group metadata including creators, roles, accounts, nested members, profile attributes, and managers.
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            createUser:
              $ref: '#/components/schemas/User'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/Account'
            users:
              type: array
              items:
                $ref: '#/components/schemas/User'
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/ProfileAttribute'
            groupManagers:
              type: array
              items:
                $ref: '#/components/schemas/User'
            groups:
              type: array
              items:
                $ref: '#/components/schemas/Group'
    GroupCollection:
      title: Group Collection
      type: object
      description: Contains pagination metadata and an array of groups.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of groups.
          items:
            $ref: '#/components/schemas/Group'
    HistoryOptionsEnum:
      title: History Options Enum
      type: string
      enum:
        - All
        - ReleasedOnly
        - ReleasedAndRevisionTip
        - RevisionTip
      description: |-
        Specifies which iterations to include when reading file or item history. Possible values:

        - ``All`` - Include every iteration in scope.
        - ``ReleasedOnly`` - Include only iterations in a consumable (released) state.
        - ``ReleasedAndRevisionTip`` - Include iterations that are either the revision tip or released.
        - ``RevisionTip`` - Include only the tip iteration for each revision.
    IndexingStatus:
      title: Indexing Status
      type: string
      enum:
        - IndexingComplete
        - IndexingProperties
        - IndexingContent
        - NA
      description: |-
        Indicates the current status of the indexing engine. This status helps users understand whether the indexing operation is complete or still in progress. This is particularly important for customers with large datasets, as indexing can take a considerable amount of time to complete.
        Possible values:

        - ``IndexingComplete`` - All properties and content have been indexed.
        - ``IndexingProperties`` - File properties are currently being indexed.
        - ``IndexingContent`` - File content is currently being indexed.
        - ``NA`` - Not applicable as data not retrieved from index.

        Note: When the status is either 'IndexingProperties' or 'IndexingContent', the search results are incomplete because the indexes are still being created. Complete search results will be available once fully indexed.
    Item:
      title: Item
      type: object
      description: Contains the item identity and referenced item iteration returned by list operations.
      properties:
        id:
          type: string
          description: The unique identifier (master ID) of the item.
        url:
          description: The relative URL to access this item.
          allOf:
            - $ref: '#/components/schemas/Url'
        versionType:
          description: The version type of the referenced item version.
          allOf:
            - $ref: '#/components/schemas/VersionTypeEnum'
        itemVersion:
          description: The referenced item version details.
          allOf:
            - $ref: '#/components/schemas/ItemVersion'
      required:
        - id
        - url
    CreateItemRequest:
      title: Create Item Request
      type: object
      description: Contains the input required to create a new item.
      properties:
        categoryUrl:
          type: string
          minLength: 1
          description: The relative URL of the item category to assign to the new item.
        itemNumber:
          type: string
          minLength: 1
          maxLength: 128
          description: The explicit item number to assign to the new item. Pass this instead of ``numberingSchemeUrl`` when the number is supplied by the caller.
        numberingSchemeUrl:
          type: string
          minLength: 1
          description: The relative URL of the item numbering scheme to use when creating the new item number. Pass this instead of ``itemNumber`` when the number should be generated from a numbering scheme.
        numberingSchemeFieldInputs:
          type: array
          description: User-entered values for numbering scheme fields that require input, such as free-text and predefined-list fields. Values must be supplied in the same order as those input fields appear in the numbering scheme. Omit or pass an empty array for fully automatic numbering schemes.
          items:
            type: string
        unitUrl:
          type: string
          minLength: 1
          description: The relative URL of the unit of measure for the new item. If omitted, the item category default is used.
        title:
          type: string
          description: The item title.
        description:
          type: string
          description: The item description/detail text.
        comment:
          type: string
          description: The item commit comment.
        properties:
          type: array
          description: Initial item property values to set during create. These values are written in the same atomic create transaction as the item commit.
          items:
            $ref: '#/components/schemas/CreateItemProperty'
      required:
        - categoryUrl
      oneOf:
        - required:
            - itemNumber
          not:
            required:
              - numberingSchemeUrl
        - required:
            - numberingSchemeUrl
          not:
            required:
              - itemNumber
    CreateItemProperty:
      title: Create Item Property
      type: object
      description: Contains a property value to set when creating an item.
      properties:
        propertyDefinitionUrl:
          type: string
          minLength: 1
          description: The relative URL of the property definition that this value belongs to.
        value:
          type: string
          description: The property value to set.
      required:
        - propertyDefinitionUrl
    AddFileRequest:
      title: Add File Request
      type: object
      description: Contains the input required to add a file from a completed upload.
      properties:
        folderId:
          type: integer
          format: int64
          minimum: 1
          description: The identifier of the folder that will contain the added file.
        uploadTicket:
          type: string
          minLength: 1
          description: The opaque upload ticket returned by a Vault upload channel.
        name:
          type: string
          minLength: 1
          description: The name of the file to add.
        comment:
          type: string
          description: The initial check-in comment.
      required:
        - folderId
        - uploadTicket
        - name
    ItemAssociatedFileVersion:
      title: Item Associated File Version
      type: object
      description: Contains a file version paired with its item association type.
      properties:
        itemAssociationType:
          description: The association type between the item and the file version.
          allOf:
            - $ref: '#/components/schemas/ItemAssociationTypeEnum'
        file:
          description: The associated file version.
          allOf:
            - $ref: '#/components/schemas/FileVersionExtended'
    ItemAssociatedFileVersionCollection:
      title: Item Associated File Version Collection
      type: object
      description: Contains pagination metadata and item-associated file rows, including optional inlined folders and property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of file versions associated with item versions.
          items:
            $ref: '#/components/schemas/ItemAssociatedFileVersion'
        included:
          type: object
          description: Contains additional resources included with the associated file version results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    ItemAssociationTypeEnum:
      title: Item Association Type Enum
      type: string
      enum:
        - Primary
        - Secondary
        - Tertiary
        - StandardComponent
        - PrimarySub
        - SecondarySub
        - PinnedAttachment
        - NotPinnedAttachment
      description: |-
        Describes how an item links to a file version. Possible values:

        - ``Primary`` - Primary item-to-file association.
        - ``Secondary`` - Secondary association.
        - ``Tertiary`` - Tertiary association.
        - ``StandardComponent`` - Standard component row in a BOM context.
        - ``PrimarySub`` - Primary sub-component association.
        - ``SecondarySub`` - Secondary sub-component association.
        - ``PinnedAttachment`` - Pinned attachment association.
        - ``NotPinnedAttachment`` - Attachment that is not pinned.
    ItemBomLink:
      title: Item Bom Link
      type: object
      description: Contains a row describing how two items relate within a bill of materials.
      properties:
        bomComponentId:
          type: string
          description: The unique identifier of the BOM component. This value is only valid when the BOM row is a component (not assigned to an item).
        groupedRow:
          type: boolean
          description: |-
            Indicates whether this BOM association is a grouped row of multiple BOM rows.

            ``true``: This BOM association is a grouped row.

            ``false``: This BOM association is a single row.
        groupId:
          type: string
          description: The unique identifier of the multiple-row grouping.
        unitSize:
          type: string
          description: The unit size for this BOM row.
        instCount:
          type: string
          description: The instance count of this BOM association.
        cad:
          type: boolean
          description: |-
            Indicates whether this BOM row is created and maintained by CAD data or is a manual BOM row.

            ``true``: This BOM row is created and maintained by CAD data.

            ``false``: This BOM row is a manual BOM row.
        included:
          type: boolean
          description: |-
            Indicates whether this BOM row is included in the BOM.

            ``true``: This BOM row is included in the BOM.

            ``false``: This BOM row is excluded from the BOM.
        refDesId:
          type: string
          description: The reference designator ID. This value will be 0 if reference designators are not available.
        childHasChildren:
          type: boolean
          description: |-
            Indicates whether the child item has children of its own.

            ``true``: The child item has children.

            ``false``: The child item is a leaf.
        bomLinkMasterId:
          type: string
          description: The master ID of the item association. This value does not change between iterations.
        bomOrder:
          type: string
          description: The order that the child entry shows up in the BOM.
        units:
          type: string
          description: The display name for the Unit of Measure on CldItemUsage.
        quantity:
          type: string
          description: The quantity for this BOM row.
        childItemId:
          type: string
          description: The ID of the child Item.
        parentItemId:
          type: string
          description: The ID of the parent Item.
        id:
          type: string
          description: The unique identifier of the BOM link.
        parentMasterChildMasterAndRefDesMaster:
          type: string
          description: Composite key containing parent master ID, child master ID, and reference designator master ID.
        childMasterAndRefDesMaster:
          type: string
          description: Composite key containing child master ID and reference designator master ID.
        isStatic:
          type: boolean
          description: |-
            Indicates whether the dependency is static or computed.

            ``true``: The dependency is static.

            ``false``: The dependency is computed.
        positionNumber:
          type: string
          description: The assigned position number for this BOM row.
        properties:
          type: array
          description: An array of property values for this BOM link.
          items:
            $ref: '#/components/schemas/Property'
    ItemBomOccurrence:
      title: Item Bom Occurrence
      type: object
      description: Contains occurrence metadata for a node in an item BOM tree, including path and parent linkage.
      properties:
        rootItemId:
          type: string
          description: The top most Item of the BOM.
        id:
          type: string
          description: A unique identifier for this occurrence within the Item BOM.
        parentOccurrenceId:
          type: string
          description: The immediate parent. -1 means no parent occurrence.
        bomLinkMasterId:
          type: string
          description: The master identifier of the BOM link associated with this occurrence.
        position:
          type: string
          description: The position on the BOM.
        detailId:
          type: string
          description: The value of the occurrence, also known as the detail ID.
        path:
          type: string
          description: The path to the occurrence in the BOM. The format is the list of Item Master IDs separated by the '/' delimiter.
    ItemVersionCollection:
      title: Item Version Collection
      type: object
      description: Contains pagination metadata and item version rows, with optional inlined property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of item versions.
          items:
            $ref: '#/components/schemas/ItemVersion'
        included:
          type: object
          description: Contains additional resources included with the item version results.
          properties:
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    ItemVersionResults:
      title: Item Version Results
      type: object
      description: Contains item version rows without pagination.
      properties:
        results:
          type: array
          description: An array of item versions.
          items:
            $ref: '#/components/schemas/ItemVersion'
    ItemCollection:
      title: Item Collection
      type: object
      description: Contains pagination metadata and item rows, with optional inlined property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of items.
          items:
            $ref: '#/components/schemas/Item'
        included:
          type: object
          description: Contains additional resources included with the item results.
          properties:
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    ItemVersion:
      title: Item Version
      type: object
      description: Contains metadata for an item iteration, including numbering, lifecycle, and referenced item master.
      properties:
        id:
          type: string
          description: The unique identifier (iteration ID) of the item version.
        url:
          description: The relative URL to access this item version.
          allOf:
            - $ref: '#/components/schemas/Url'
        number:
          type: string
          description: The Item number.
        version:
          type: number
          description: The version number, which is a sequential number given to each version. For example, if this value is 5, then the object is the 5th version.
        revision:
          type: string
          description: The display value for the revision.
        comment:
          type: string
          description: The comment associated with this item version.
        title:
          type: string
          description: The display title.
        state:
          type: string
          description: The lifecycle state of this item version.
        stateColor:
          type: number
          description: The color associated with the item's lifecycle state.
        name:
          type: string
          description: The display name of the item.
        category:
          type: string
          description: The category assigned to this item.
        categoryColor:
          type: number
          description: The color associated with the item's category.
        entityType:
          type: string
          description: The type of entity represented by this item version.
        isReadOnly:
          type: boolean
          description: |-
            Indicates whether this item version is read-only for the current user.

            ``true``: This item version is read-only.

            ``false``: This item version is editable.
        isCloaked:
          type: boolean
          description: |-
            Indicates whether this item version is cloaked for the logged-in user.

            ``true``: The logged-in user is restricted from seeing this item version.

            ``false``: The logged-in user can view this item version.
        isLatestObsolete:
          type: boolean
          description: |-
            Indicates whether the latest item version is obsolete.

            ``true``: The latest item version is obsolete.

            ``false``: The latest item version is not obsolete.
        item:
          description: The item master associated with this item version.
          allOf:
            - $ref: '#/components/schemas/Item'
        lifecycleState:
          description: The lifecycle state of this item version.
          allOf:
            - $ref: '#/components/schemas/LifecycleState'
        properties:
          type: array
          description: An array of property values for this item version.
          items:
            $ref: '#/components/schemas/Property'
    Job:
      title: Job
      type: object
      description: Contains job queue metadata. A job represents work executed by the job processor.
      properties:
        id:
          type: string
          description: A unique identifier for the job.
        jobType:
          type: string
          description: The job type.
        priority:
          type: number
          description: The priority of the job. Lower numeric values indicate higher priority; the lowest accepted value is ``1`` (highest priority).
        description:
          type: string
          description: A description of the job.
        url:
          description: The relative URL to access this job.
          allOf:
            - $ref: '#/components/schemas/Url'
        params:
          type: object
          additionalProperties:
            type: string
          description: Contains a user-defined map of string key-value pairs that provide metadata about the job.
        status:
          type: string
          enum:
            - Ready
            - Running
            - Success
            - Failure
          description: |-
            The status of the job. Possible values:

            - ``Ready`` - The job is ready to be run.
            - ``Running`` - The job is currently running.
            - ``Success`` - The job has completed successfully.
            - ``Failure`` - The job has failed.
        isOnSite:
          type: boolean
          description: Indicates whether the file is on the local site in a multi-site environment.
    CreateJobRequest:
      title: Create Job Request
      type: object
      description: Specifies the payload for creating a Vault job queue entry.
      properties:
        jobType:
          type: string
          description: The job type.
        priority:
          type: number
          description: The priority of the job. Lower numeric values indicate higher priority; the lowest accepted value is ``1`` (highest priority).
        description:
          type: string
          description: A description of the job.
        params:
          type: object
          additionalProperties:
            type: string
          description: Contains a user-defined map of string key-value pairs that provide metadata about the job.
    LinkCollection:
      title: Link Collection
      type: object
      description: Contains pagination metadata and hyperlink entities, including optional inlined folders and property definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of links.
          items:
            $ref: '#/components/schemas/LinkEntity'
        included:
          type: object
          description: Contains additional resources included with the link results.
          properties:
            folder:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Folder'
            propertyDefinition:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/PropertyDefinition'
    LinkEntity:
      title: Link
      type: object
      description: Contains metadata linking two Vault entities.
      properties:
        name:
          type: string
          description: The name of the link.
        id:
          type: string
          description: The unique identifier of this link.
        createDate:
          type: string
          format: date-time
          description: The date and time when the link was created.
        createUserName:
          type: string
          description: The user name of the user who created the link.
        entityType:
          type: string
          description: The type of entity represented by this link.
        url:
          description: The relative URL to access this link.
          allOf:
            - $ref: '#/components/schemas/Url'
        toEntity:
          description: The destination entity for this link.
          allOf:
            - $ref: '#/components/schemas/Entity'
        fromEntity:
          description: The source entity for this link.
          allOf:
            - $ref: '#/components/schemas/Folder'
    Markup:
      title: Markup
      type: object
      description: Contains markup annotation data tied to a file version. Markup captures visual overlays added by users.
      properties:
        id:
          type: string
          description: The unique identifier of the markup.
        parentId:
          type: string
          description: The unique identifier of the parent markup when this markup is a reply.
        createdByUser:
          description: The user who created this markup.
          allOf:
            - $ref: '#/components/schemas/User'
        createDateTime:
          type: string
          format: date-time
          description: The date and time when the markup was created.
        updatedByUser:
          description: The user who last updated this markup.
          allOf:
            - $ref: '#/components/schemas/User'
        updateDateTime:
          type: string
          format: date-time
          description: The date and time when the markup was last updated.
        data:
          type: string
          description: The serialized markup payload.
        thumbnail:
          type: string
          description: The thumbnail image data or URI for the markup.
        url:
          description: The relative URL to access this markup.
          allOf:
            - $ref: '#/components/schemas/Url'
    MarkupCollection:
      title: Markup Collection
      type: object
      description: Contains pagination metadata and markup rows returned for the requested file versions.
      properties:
        results:
          type: array
          description: An array of markups.
          items:
            $ref: '#/components/schemas/Markup'
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
    ProfileAttribute:
      title: Profile Attribute
      type: object
      description: Contains a persisted profile attribute assignment for a user or group.
      properties:
        userGroupId:
          type: string
          description: The unique identifier of the user or group that this profile attribute is associated with.
        attributeId:
          type: string
          description: The unique identifier of the profile attribute definition.
        value:
          type: string
          description: The value of the profile attribute.
    ProfileAttributeDefinition:
      title: Profile Attribute Definition
      type: object
      description: Contains metadata defining a Vault profile attribute, including mappings and applicability.
      properties:
        id:
          type: string
          description: The unique identifier of the profile attribute definition.
        attributeName:
          type: string
          description: Name of the profile attribute (must be unique).
        systemName:
          type: string
          description: The internal system name of the profile attribute.
        activeDirectoryMapping:
          type: string
          description: Active Directory field the attribute is mapped from (null if not mapped).
        association:
          type: string
          enum:
            - None
            - User
            - Group
            - All
          description: |-
            Specifies which directory objects may use this profile attribute definition. Possible values:

            - ``None`` - Not associated with users or groups.
            - ``User`` - Applies to user profiles.
            - ``Group`` - Applies to group profiles.
            - ``All`` - Applies to both users and groups.
        url:
          description: The relative URL to access this profile attribute definition.
          allOf:
            - $ref: '#/components/schemas/Url'
    ProfileAttributeDefinitionCollection:
      title: Profile Attribute Definition Collection
      type: object
      description: Contains pagination metadata and profile attribute definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of profile attribute definitions.
          items:
            $ref: '#/components/schemas/ProfileAttributeDefinition'
    Property:
      title: Property
      type: object
      description: Contains a single property-value pair anchored to its property definition identifier.
      properties:
        propertyDefinitionId:
          type: string
          description: The unique identifier of the property definition that this value belongs to.
        definition:
          description: The property definition metadata for this property value.
          allOf:
            - $ref: '#/components/schemas/PropertyDefinition'
        value:
          type: string
          description: The property value associated with the entity for the referenced property definition.
    UpdatePropertiesRequest:
      title: Update Properties Request
      type: object
      required:
        - properties
      properties:
        properties:
          type: array
          description: The user-defined properties to update.
          minItems: 1
          items:
            $ref: '#/components/schemas/Property'
    PropertyDefinition:
      title: Property Definition
      type: object
      description: Contains server-side metadata for a Vault property definition, including datatype and naming.
      properties:
        id:
          type: string
          description: The unique identifier of the property definition.
        url:
          description: The relative URL to access this property definition.
          allOf:
            - $ref: '#/components/schemas/Url'
        displayName:
          type: string
          description: The display name of this property definition.
        systemName:
          type: string
          description: The system name of this property definition.
        dataType:
          type: string
          description: The underlying data type stored for values of this property.
          enum:
            - String
            - Numeric
            - Bool
            - DateTime
            - Image
        active:
          type: boolean
          description: |-
            Indicates whether this property definition is active.

            ``true``: This property definition is active.

            ``false``: This property definition is inactive.
        isSystem:
          type: boolean
          description: |-
            Indicates whether this property definition is a built-in system property.

            ``true``: This is a system property.

            ``false``: This is a user-defined property.
        initialValue:
          type: string
          description: The default value applied to entities that do not have an existing value for this property definition.
      required:
        - id
        - displayName
        - systemName
        - dataType
    PropertyDefinitionExtended:
      title: Property Definition Extended
      type: object
      description: Contains extended property definition data, including enumerated list values where applicable.
      allOf:
        - $ref: '#/components/schemas/PropertyDefinition'
        - type: object
      properties:
        listValues:
          type: array
          description: An array of possible values for properties based on this property definition.
          items:
            type: string
    PropertyDefinitionCollection:
      title: Property Definition Collection
      type: object
      description: Contains pagination metadata and property definitions, basic or extended.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of property definitions.
          items:
            oneOf:
              - $ref: '#/components/schemas/PropertyDefinition'
              - $ref: '#/components/schemas/PropertyDefinitionExtended'
    Category:
      title: Category
      type: object
      description: Contains a category.
      properties:
        id:
          type: string
          description: The unique identifier of a category.
        url:
          description: The relative URL to access this category.
          allOf:
            - $ref: '#/components/schemas/Url'
        name:
          type: string
          description: The display name of this category.
        displayName:
          type: string
          description: The display name of this category.
        systemName:
          type: string
          description: The system name of this category.
        entityClassId:
          type: integer
          format: int64
          description: The numeric entity class ID this category belongs to.
        entityClassBaseId:
          type: string
          description: The base entity class ID this category belongs to, e.g., FILE, ITEM, CO.
        assignmentType:
          type: string
          description: The category assignment type for this entity class.
          enum:
            - Assignable
            - Default
            - Disabled
        description:
          type: string
          description: The description of this category.
        color:
          type: integer
          description: The color code of this category.
      required:
        - id
    CategoryCollection:
      title: Category Collection
      type: object
      description: Contains a collection of categories.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of categories.
          items:
            $ref: '#/components/schemas/Category'
    UnitOfMeasure:
      title: Unit of Measure
      type: object
      description: Contains a unit of measure.
      properties:
        id:
          type: string
          description: The unique identifier of a unit of measure.
        url:
          description: The relative URL to access this unit of measure.
          allOf:
            - $ref: '#/components/schemas/Url'
        name:
          type: string
          description: The name of this unit of measure.
        abbreviation:
          type: string
          description: The abbreviation of this unit of measure.
        systemName:
          type: string
          description: The system name of this unit of measure.
        conversion:
          type: number
          description: The conversion factor relative to the base unit of measure.
        baseUnitOfMeasureId:
          type: string
          description: The unique identifier of the base unit of measure.
        isSystem:
          type: boolean
          description: Indicates whether this is a system-defined unit of measure.
      required:
        - id
    UnitOfMeasureCollection:
      title: Unit of Measure Collection
      type: object
      description: Contains a collection of units of measure.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of units of measure.
          items:
            $ref: '#/components/schemas/UnitOfMeasure'
    LifecycleDefinition:
      title: Lifecycle Definition
      type: object
      description: Contains a lifecycle definition.
      properties:
        id:
          type: string
          description: The unique identifier of a server-based lifecycle definition.
        url:
          description: The relative URL to access this lifecycle definition.
          allOf:
            - $ref: '#/components/schemas/Url'
        name:
          type: string
          description: The name of this lifecycle definition.
        displayName:
          type: string
          description: The display name of this lifecycle definition.
        systemName:
          type: string
          description: The system name of this lifecycle definition.
        description:
          type: string
          description: The description of this lifecycle definition.
      required:
        - id
    LifecycleDefinitionExtended:
      title: Lifecycle Definition Extended
      type: object
      description: Contains extended lifecycle definition data, including the ordered lifecycle states.
      allOf:
        - $ref: '#/components/schemas/LifecycleDefinition'
        - type: object
      properties:
        states:
          type: array
          description: An array of lifecycle states in this lifecycle definition.
          items:
            oneOf:
              - $ref: '#/components/schemas/LifecycleState'
              - $ref: '#/components/schemas/LifecycleStateExtended'
    LifecycleDefinitionCollection:
      title: Lifecycle Definition Collection
      type: object
      description: Contains a collection of lifecycle definitions.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of lifecycle definitions.
          items:
            oneOf:
              - $ref: '#/components/schemas/LifecycleDefinition'
              - $ref: '#/components/schemas/LifecycleDefinitionExtended'
    NumberingScheme:
      title: Numbering Scheme
      type: object
      description: Contains a numbering scheme with field details.
      properties:
        id:
          type: string
          description: The unique identifier of a numbering scheme.
        url:
          description: The relative URL to access this numbering scheme.
          allOf:
            - $ref: '#/components/schemas/Url'
        name:
          type: string
          description: The name of this numbering scheme.
        systemName:
          type: string
          description: The system name of this numbering scheme, if it is a system scheme.
        entityClassId:
          type: string
          description: The entity class this numbering scheme belongs to, e.g., FILE, ITEM, CO.
        isActive:
          type: boolean
          description: Whether this numbering scheme is activated.
        isInUse:
          type: boolean
          description: Whether this numbering scheme has been used to generate numbers and is therefore no longer editable.
        isDefault:
          type: boolean
          description: Whether this numbering scheme is the default for its entity class.
        isSystem:
          type: boolean
          description: Whether this numbering scheme is a built-in system scheme.
        provider:
          type: string
          description: The system name of the number provider backing this scheme.
        reuseNumbers:
          type: boolean
          description: Whether this numbering scheme reuses released numbers.
        toUpperCase:
          type: boolean
          description: Whether generated numbers are forced to upper case.
        fields:
          type: array
          description: The ordered field definitions that compose generated numbers for this scheme.
          items:
            $ref: '#/components/schemas/NumberingSchemeField'
      required:
        - id
    NumberingSchemeField:
      title: Numbering Scheme Field
      type: object
      description: Contains a numbering scheme field definition.
      properties:
        index:
          type: integer
          description: The zero-based position of this field in the numbering scheme.
        type:
          description: The type of numbering scheme field.
          allOf:
            - $ref: '#/components/schemas/NumberingSchemeFieldTypeEnum'
        name:
          type: string
          description: The display name of this field, when applicable.
        value:
          type: string
          description: The fixed value for delimiter or fixed-text fields, when applicable.
        length:
          type: integer
          description: The field length for autogenerated or complex fields, when applicable.
        minLength:
          type: integer
          description: The minimum input length for free-text fields.
        maxLength:
          type: integer
          description: The maximum input length for free-text fields.
        defaultValue:
          type: string
          description: The default value for free-text or predefined-list fields.
        rangeFrom:
          type: integer
          description: The first generated value for autogenerated fields.
        rangeTo:
          type: integer
          description: The last generated value for autogenerated fields.
        stepSize:
          type: integer
          description: The increment between generated values for autogenerated fields.
        zeroPadding:
          type: boolean
          description: Whether autogenerated values are padded with leading zeroes.
        codeList:
          type: array
          description: The allowed code words for predefined-list fields.
          items:
            $ref: '#/components/schemas/NumberingSchemeCodeWord'
      required:
        - index
        - type
    NumberingSchemeCodeWord:
      title: Numbering Scheme Code Word
      type: object
      description: Contains a predefined list code word.
      properties:
        code:
          type: string
          description: The code value.
        description:
          type: string
          description: The code description.
    NumberingSchemeFieldTypeEnum:
      title: Numbering Scheme Field Type Enum
      type: string
      enum:
        - FixedText
        - FreeText
        - Delimiter
        - PredefinedList
        - Autogenerated
        - Complex
        - WorkgroupLabel
    NumberingSchemeCollection:
      title: Numbering Scheme Collection
      type: object
      description: Contains a collection of numbering schemes.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of numbering schemes.
          items:
            $ref: '#/components/schemas/NumberingScheme'
      required:
        - pagination
        - results
    LifecycleState:
      title: Lifecycle State
      type: object
      description: Contains a lifecycle state.
      properties:
        id:
          type: string
          description: The unique identifier of a server-based lifecycle state.
        url:
          description: The relative URL to access this lifecycle state.
          allOf:
            - $ref: '#/components/schemas/Url'
        name:
          type: string
          description: The name of this lifecycle state.
        displayName:
          type: string
          description: The display name of this lifecycle state.
        description:
          type: string
          description: The description of this lifecycle state.
        comments:
          type: array
          description: A list of predefined comments available for selection when changing entity states.
          items:
            type: string
        isDefault:
          type: boolean
          description: |-
            ``true``: This state is the default state of the lifecycle definition.

            ``false``: This state is not the default state of the lifecycle definition.
        color:
          type: integer
          description: The color code of this lifecycle state icon.
        isReleasedState:
          type: boolean
          description: |-
            Indicates whether this state is a released state.

            ``true``: This state is a released state.

            ``false``: This state is not a released state.
        isObsoleteState:
          type: boolean
          description: |-
            Indicates whether this state is an obsolete state.

            ``true``: This state is an obsolete state.

            ``false``: This state is not an obsolete state.
        displayOrder:
          type: integer
          description: The display order of this state among other states of the same lifecycle definition.
      required:
        - id
        - name
        - displayName
        - isDefault
    LifecycleStateExtended:
      title: Lifecycle State Extended
      type: object
      description: Contains extended lifecycle state data, including the owning lifecycle definition.
      allOf:
        - $ref: '#/components/schemas/LifecycleState'
        - type: object
      properties:
        lifecycleDefinition:
          description: The lifecycle definition that this state belongs to.
          allOf:
            - $ref: '#/components/schemas/LifecycleDefinition'
    LifecycleStateCollection:
      title: Lifecycle State Collection
      type: object
      description: Contains a collection of lifecycle states.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of lifecycle states.
          items:
            oneOf:
              - $ref: '#/components/schemas/LifecycleState'
              - $ref: '#/components/schemas/LifecycleStateExtended'
    RevisionOptionsEnum:
      title: Revision Options Enum
      type: string
      enum:
        - AllRevision
        - CurrentRevision
      description: |-
        Specifies the revision scope for history queries. Possible values:

        - ``AllRevision`` - Include all revisions.
        - ``CurrentRevision`` - Restrict results to the current revision only.
    Role:
      title: Role
      type: object
      description: Contains a Vault role. Roles group permissions granted to users and groups.
      properties:
        id:
          type: string
          description: A unique identifier of the role.
        roleName:
          type: string
          description: The name of the role.
        systemName:
          type: string
          description: The system name of the Role.
        description:
          type: string
          description: A human-readable description of the role's purpose.
        url:
          description: The relative URL to access this role.
          allOf:
            - $ref: '#/components/schemas/Url'
    RoleCollection:
      title: Role Collection
      type: object
      description: Contains pagination metadata and security roles returned for the Vault.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of roles.
          items:
            $ref: '#/components/schemas/Role'
    SearchCriteria:
      title: Search Criteria
      type: object
      description: Specifies a single criterion used in Advanced Search payloads.
      properties:
        propertyDefinitionUrl:
          type: string
          description: The relative URL of the property definition to evaluate in this criterion.
        operator:
          type: string
          enum:
            - Unknown
            - Contains
            - DoesNotContain
            - IsExactly
            - IsEmpty
            - IsNotEmpty
            - GreaterThan
            - GreaterThanOrEqualTo
            - LessThan
            - LessThanOrEqualTo
            - NotEqualTo
          description: Represents the operator used for the search.
        searchString:
          type: string
          description: The value to compare against using the supplied operator.
      required:
        - operator
      x-examples:
        Example 1:
          propertyDefinitionUrl: /AutodeskDM/Services/api/vault/v2/vaults/106/property-definitions/9
          operator: Contains
          searchString: SM-TEST-01
    SortCriteria:
      title: Sort Criteria
      type: object
      description: Specifies sorting instructions referencing a property definition URL and ascending flag.
      properties:
        propertyDefinitionUrl:
          type: string
          description: |
            URL string to the property definition
        ascending:
          type: boolean
          description: |-
            ``true``: Sort results in ascending order.

            ``false``: Sort results in descending order.
      x-examples:
        Example 1:
          propertyDefinitionUrl: /AutodeskDM/Services/api/vault/v2/vaults/106/property-definitions/30
          ascending: true
    UpdateLifecycleStatesRequest:
      title: Update Lifecycle States Request
      type: object
      description: |-
        Request to update lifecycle states without changing lifecycle definitions. For items and files, an optional
        revision may be supplied per entry to update state and revision together.
      properties:
        updateLifecycleStateRequests:
          type: array
          minItems: 1
          description: An array of requests to update the lifecycle state of entities (at least one entry required).
          items:
            $ref: '#/components/schemas/UpdateLifecycleStateRequest'
        comment:
          type: string
          description: A comment to be added when changing the lifecycle state.
      required:
        - updateLifecycleStateRequests
    UpdateLifecycleStateRequest:
      title: Update Lifecycle State Request
      type: object
      description: Specifies the target lifecycle state for a single entity within its current lifecycle definition.
      properties:
        entityUrl:
          type: string
          minLength: 1
          description: The URL of the entity to update. For files and items, use the File or Item entity type rather than the FileVersion or ItemVersion entity type.
        lifecycleStateUrl:
          type: string
          minLength: 1
          description: The URL of the target lifecycle state.
        revision:
          type: string
          minLength: 1
          description: |-
            An optional revision label to apply during the state transition. Applicable to files and items only;
            omit for folders or when the revision should be determined by lifecycle rules.
      required:
        - entityUrl
        - lifecycleStateUrl
    UpdateCategoriesRequest:
      title: Update Categories Request
      type: object
      description: Batch request for assigning categories to files.
      properties:
        updateFileCategoryRequests:
          type: array
          minItems: 1
          description: One or more file category assignments.
          items:
            $ref: '#/components/schemas/UpdateCategoryRequest'
        comment:
          type: string
          description: A comment to record with the category change.
      required:
        - updateFileCategoryRequests
    UpdateCategoryRequest:
      title: Update Category Request
      type: object
      description: Specifies the category to assign to a single file.
      properties:
        entityUrl:
          type: string
          minLength: 1
          description: The URL of the File entity to update.
        categoryUrl:
          type: string
          minLength: 1
          description: The URL of the category to assign.
      required:
        - entityUrl
        - categoryUrl
    UpdateLifecycleDefinitionsRequest:
      title: Update Lifecycle Definitions Request
      type: object
      description: |-
        Batch request for assigning lifecycle definitions and states. Each entry must supply the entity, definition,
        and lifecycle state URLs; for each entry, the specified lifecycle state must belong to the specified
        lifecycle definition.
      properties:
        updateLifecycleDefinitionRequests:
          type: array
          minItems: 1
          description: One or more entries, each identifying an entity, its new lifecycle definition, and the target lifecycle state within that definition.
          items:
            $ref: '#/components/schemas/UpdateLifecycleDefinitionRequest'
        comment:
          type: string
          description: Optional comment recorded with the lifecycle definition change.
      required:
        - updateLifecycleDefinitionRequests
    UpdateLifecycleDefinitionRequest:
      title: Update Lifecycle Definition Request
      type: object
      description: Identifies one entity and specifies both the lifecycle definition and the target state to assign.
      properties:
        entityUrl:
          type: string
          minLength: 1
          description: The URL of the entity to update. For files and items, use the File or Item entity type rather than the FileVersion or ItemVersion entity type.
        lifecycleDefinitionUrl:
          type: string
          minLength: 1
          description: The URL of the lifecycle definition to assign.
        lifecycleStateUrl:
          type: string
          minLength: 1
          description: The URL of the target state within the specified lifecycle definition.
      required:
        - entityUrl
        - lifecycleDefinitionUrl
        - lifecycleStateUrl
    User:
      title: User
      type: object
      description: Contains core Vault account metadata returned for directory operations.
      properties:
        id:
          type: string
          description: A unique number that the Vault uses to reference the user.
        name:
          type: string
          description: The login name of the user.
        email:
          type: string
          description: The email address of the user.
        authTypes:
          description: The authentication types available for this user.
          allOf:
            - $ref: '#/components/schemas/AuthTypeEnum'
        systemName:
          type: string
          description: The internal system name of the user.
        createDate:
          type: string
          format: date-time
          description: The date that the user was created.
        isActive:
          type: boolean
          description: |-
            Indicates whether this user is active.

            ``true``: The user is active.

            ``false``: The user is inactive.
        url:
          description: The relative URL to access this user.
          allOf:
            - $ref: '#/components/schemas/Url'
    UserExtended:
      title: User Extended
      type: object
      description: Contains expanded user metadata including memberships, Knowledge Vault associations, roles, accounts, profiles, audit info, and administration flags.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            firstName:
              type: string
              description: The first name of the user.
            lastName:
              type: string
              description: The last name of the user.
            analyticsId:
              type: string
              description: The analytics identifier associated with this user.
            roles:
              type: array
              description: An array of roles associated with this user.
              items:
                $ref: '#/components/schemas/Role'
            vaults:
              type: array
              description: An array of Knowledge Vaults associated with this user.
              items:
                $ref: '#/components/schemas/Vault'
            groups:
              type: array
              description: An array of groups in which the user is a direct member.
              items:
                $ref: '#/components/schemas/Group'
            accounts:
              type: array
              description: An array of accounts associated with this user.
              items:
                $ref: '#/components/schemas/Account'
            attributes:
              type: array
              description: An array of profile attribute values for this user.
              items:
                type: object
                properties:
                  definition:
                    $ref: '#/components/schemas/ProfileAttributeDefinition'
                  value:
                    type: string
            isAdministrator:
              type: boolean
              default: false
              description: |-
                Indicates whether the user has Vault administrator privileges for this server.

                ``true``: The user has Vault administrator privileges for this server.

                ``false``: The user does not have Vault administrator privileges.
            createUser:
              $ref: '#/components/schemas/User'
    UserCollection:
      title: User Collection
      type: object
      description: Contains pagination metadata and Vault user accounts.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of users.
          items:
            $ref: '#/components/schemas/User'
    Vault:
      title: Vault
      type: object
      description: Contains identifying metadata for a Knowledge Vault.
      properties:
        name:
          type: string
          description: The name of the Knowledge Vault. This is also the name of the database.
        id:
          type: string
          description: A unique identifier for the Knowledge Vault.
        url:
          description: The relative URL to access this Knowledge Vault.
          allOf:
            - $ref: '#/components/schemas/Url'
    VaultCollection:
      title: Vault Collection
      type: object
      description: Contains pagination metadata and Knowledge Vault summaries.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of Knowledge Vaults.
          items:
            $ref: '#/components/schemas/Vault'
    VaultOption:
      title: Vault Option
      type: object
      description: Contains a single Knowledge Vault option key-value pair and resource URL.
      properties:
        id:
          type: string
          description: The unique identifier of the option.
        name:
          type: string
          description: The name of the option.
        value:
          type: string
          description: The value of the option.
        url:
          description: The relative URL to access this Knowledge Vault option.
          allOf:
            - $ref: '#/components/schemas/Url'
    VaultOptionCollection:
      title: Vault Option Collection
      type: object
      description: Contains pagination metadata and Knowledge Vault options exposed by the Vault.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of Knowledge Vault options.
          items:
            $ref: '#/components/schemas/VaultOption'
    UserEffectiveSetting:
      title: User Effective Setting
      type: object
      description: |-
        A resolved effective client option for a user within a namespace scope.
        The ``url`` points to ``GET /users/{userId}/effective-settings/{settingId}``; namespace is encoded in ``id``.
      properties:
        id:
          type: string
          description: URL-safe Base64 of UTF-16 LE bytes for namespace + U+001F + bare option name (composite unique id).
        name:
          type: string
          description: Bare KVM option name within the namespace (for example, `ReadOnly`).
        value:
          type: string
          description: Resolved effective option value.
        url:
          description: The relative URL to access this effective setting (for example, ``.../users/2/effective-settings/{settingId}``).
          allOf:
            - $ref: '#/components/schemas/Url'
    UserEffectiveSettingCollection:
      title: User Effective Setting Collection
      type: object
      description: |-
        Paginated collection of effective user settings for a namespace scope.
        Use ``GET /users/{userId}/effective-settings?filter[namespace]=TC`` to populate this collection.
      properties:
        pagination:
          description: Contains pagination metadata for this collection.
          allOf:
            - $ref: '#/components/schemas/CursorBasedPagination'
        results:
          type: array
          description: An array of effective user settings.
          items:
            $ref: '#/components/schemas/UserEffectiveSetting'
    VersionTypeEnum:
      title: Version Type Enum
      type: string
      enum:
        - None
        - Latest
        - LatestReleased
      description: |-
        Specifies which file or item iteration to resolve. Possible values:

        - ``None`` - No special version selection.
        - ``Latest`` - Use the latest iteration.
        - ``LatestReleased`` - Use the latest released (consumable) iteration.
    XRefTypeEnum:
      title: XRef Type Enum
      type: string
      enum:
        - Internal
        - External
      description: |-
        Specifies whether a component reference is internal or external to the host design file. Possible values:

        - ``Internal`` - Reference resolves inside the same design file (numeric 0 in some clients).
        - ``External`` - Reference points to another design file (numeric 1 in some clients).
    Session:
      title: Session
      type: object
      description: Contains session credentials issued by Vault sign-in flows, alongside resolved user and Vault context.
      properties:
        id:
          type: string
          description: The unique identifier of the session.
        accessToken:
          type: string
          description: The access token issued for this session. Pass this value in the ``Authorization`` header on subsequent requests.
        vaultInformation:
          description: The Vault context associated with this session.
          allOf:
            - $ref: '#/components/schemas/Vault'
        userInformation:
          description: The user context associated with this session.
          allOf:
            - $ref: '#/components/schemas/User'
      required:
        - accessToken
    Url:
      type: string
      description: The relative URL to access this object.
  securitySchemes:
    BearerTokenAuth:
      type: apiKey
      description: |-
        The authorization token used by the server to identify the user.

        For sessions created through Vault or Windows authentication sign-in, the token has the following format:

        Example: ``Bearer V:e4eeba1f-ffff-49b7-87b3-7525a99596b1``

        If Autodesk Account mapping is enabled for the user, the server also supports implicit Autodesk ID authentication. In that case, the user can pass a [three-legged OAuth token](https://aps.autodesk.com/en/docs/oauth/v2/tutorials/get-3-legged-token/) in the ``Authorization`` header.

        Example: ``Bearer nk8KaaHhfVcYvDF8obdKfXlMtlMg8Lz2xFG+2NEl37/hZP25WctBzNxMrEme9JRmZ62XzyUFRFQU1z5eJkpsyNZBsenyhPfN6Cd008tde+``
      name: Authorization
      in: header
    3-legged:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://developer.api.autodesk.com/authentication/v2/authorize
          tokenUrl: https://developer.api.autodesk.com/authentication/v2/token
          refreshUrl: https://developer.api.autodesk.com/authentication/v2/token
          scopes:
            data:read: read your data
            data:write: modify your data
            data:create: create new data
      x-authentication_context: user context required
      description: User context required.
  parameters:
    allowSync:
      in: query
      name: allowSync
      required: false
      schema:
        type: boolean
        default: false
      description: |-
        In a multi-site environment, this field tells if the file should be synced to the local site.

        ``true``: File is not on the local site, it will be copied to the local site.

        ``false``: (Default) File is not copied to the local site.
    extendedModels:
      in: query
      name: option[extendedModels]
      description: |
        ``true``: The response will include additional detailed information for each entity. Examples include:

        - For folders (getFolders), it will return ``FolderExtended`` instead of ``Folder``, which includes additional information such as the parent folder.
        - For file versions (getFileVersions), it will return ``FileVersionExtended`` instead of ``FileVersion``, which includes extra details like the checkout user ID.
        - For change orders (getChangeOrders), it will return ``ChangeOrderExtended`` instead of ``ChangeOrder``, which provides further information such as the list of assignees.
        - For property definitions (getPropertyDefinitions), it will return ``PropertyDefinitionExtended`` instead of ``PropertyDefinition``, which includes extra details like list values.

        ``false``: (Default) The response will include basic information for each entity.
      required: false
      schema:
        type: boolean
        default: false
    propDefIds:
      in: query
      name: option[propDefIds]
      description: The properties to include in the response. Provide a comma-separated list of property definition IDs (for example, ``1,2,3``) or pass ``all`` to return every property.
      required: false
      schema:
        type: string
    limit:
      in: query
      name: limit
      description: |-
        The maximum number of results to return per page. Defaults to ``100``.

        The hard upper bound is controlled by the **Page size configuration** setting, which an administrator can update through ADMS (**Global Setting** -> **Page size configuration**).
      required: false
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
    cursorState:
      in: query
      name: cursorState
      description: The cursor token used to fetch the next page of results. Pass the value returned in ``pagination.nextUrl`` from the previous response to continue paging.
      required: false
      schema:
        type: string
    q:
      in: query
      name: q
      description: |-
        The value to search for. By default, Vault searches across all properties of the entity.

        When the ``option[searchContent]`` query parameter is ``true``, Vault searches both properties and content.

        Example: ``q=Assembly`` returns all objects whose properties (or content, if enabled) contain ``Assembly``.
      required: false
      schema:
        type: string
