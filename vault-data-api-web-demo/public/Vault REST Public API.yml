    get:
      tags:
        - Files and Folders
      summary: Generate File Version Download URL
      description: Generates a time-limited, cryptographically signed URL that provides secure access to download the file resource for the specified file version ID.
      operationId: getFileVersionSignedUrl
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
