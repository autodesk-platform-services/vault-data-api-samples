  /vaults/{vaultId}/item-versions/{id}/bill-of-materials:
    get:
      tags:
        - Items
      summary: Get Child Items for Item Version
      description: Retrieves the bill of materials (BOM) for the specified item version. The snapshot returned depends on the ``option[bomType]`` and ``option[date]`` query parameters.
      operationId: getItemVersionBom
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - in: path
          name: id
          description: The unique identifier of an item version.
          required: true
          schema:
            type: string
        - in: query
          name: option[bomType]
          schema:
            $ref: '#/components/schemas/BOMTypeEnum'
          description: |-
            The type of BOM snapshot to return. Possible values:

            - ``Effective`` - Use the BOM that was effective for the date supplied in ``option[date]``.
            - ``Historic`` - Use a historic BOM view.
            - ``Latest`` (Default) - Use the latest BOM view.
            - ``Tip`` - Use the tip BOM view.
        - in: query
          name: option[date]
          schema:
            type: string
          description: The effective date used when ``option[bomType]`` is ``Effective``. Defaults to ``DateTime.MinValue``.
        - in: query
          name: option[rolledUp]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include a linear view of the BOM, BOM items for parts only. Only available for view operations.

            ``false``: (Default) Return a tree view of the BOM.
        - in: query
          name: option[oneLevel]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include only the current level and immediate children.

            ``false``: (Default) Include all level.
        - in: query
          name: option[referenceDesignators]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include reference designators.

            ``false``: (Default) Exclude reference designators.
        - in: query
          name: option[occurrences]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include the occurrences.

            ``false``: (Default) Exclude the occurrences.
        - in: query
          name: option[excludedBOMLinks]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include excluded BOM rows.

            ``false``: (Default) Return included BOM rows.
        - in: query
          name: option[unassignedComponents]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include unassigned components (BOM rows without associated items) in BOM rows.

            ``false``: (Default) Include only components with assigned items.
        - in: query
          name: option[includeBOMAssociationProperty]
          schema:
            type: boolean
            default: false
          description: |-
            ``true``: Include properties on BOM associations.

            ``false``: (Default) Exclude properties on BOM associations.
      responses:
        '200':
          description: The bill of materials links and revisions were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOMLinksAndRevisions'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
