openapi: 3.0.1
info:
  title: Vault Data API
  description: 'The Vault Data API provides access to the Vault database, offering a set of operations divided into two main sections: Global and Vault. The Global section includes general operations applicable across the system, while the Vault section specifically handles interactions with the Vault data. It''s designed to provide a seamless interface for users to interact with their Vaulted data. Vault Data API [Developer''s Guide](https://aps.autodesk.com/en/docs/vaultdataapi/v2/developers_guide/overview/)'
  contact:
    name: Vault Data API Feedback
  x-forge-service-name: vault
  version: 2.0.17
x-external: true
servers:
  - url: /AutodeskDM/Services/api/vault/v2
tags:
  - name: Informational
  - name: Auth
  - name: Accounts
  - name: Options
  - name: Property
  - name: Lifecycle
  - name: Files and Folders
  - name: Items
  - name: Change Orders
  - name: Links
  - name: Search
  - name: Jobs
  - name: Ext Sync Tasks
paths:
  /openapi-spec.yml:
    get:
      tags:
        - Informational
      summary: Get OpenAPI Specification
      description: Retrieves detailed information about the Vault Data API specification, including its functionalities, methods, and data structures. The response contains a YAML representation that follows the OpenAPI Specification (OAS) format.
      operationId: getApiSpec
      security: []
      responses:
        '200':
          description: The Vault Data API specification was successfully retrieved.
          content:
            application/x-yaml: {}
        '403':
          $ref: '#/components/responses/403'
  /server-info:
    get:
      tags:
        - Informational
      summary: Get Server Information
      description: Retrieves server metadata such as product version.
      operationId: getServerInfo
      security: []
      responses:
        '200':
          description: The server metadata was successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    name: Vault Professional Server
                    productVersion: 29.0.2.0
                properties:
                  name:
                    type: string
                    description: The internal product name. For backward compatibility, this value contains the original product name, which may not match the current product name.
                  productVersion:
                    type: string
                    description: 'The product version currently installed. Example: ``30.0.91.0``.'
        '403':
          $ref: '#/components/responses/403'
  /groups:
    get:
      tags:
        - Accounts
      summary: Get All Groups
      description: Retrieves all groups.
      operationId: getGroups
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The list of groups was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /groups/{id}:
    parameters:
      - schema:
          type: string
        name: id
        description: The unique identifier of a group.
        in: path
        required: true
    get:
      tags:
        - Accounts
      summary: Get a Group
      description: Retrieves a group by its ID.
      operationId: getGroupById
      responses:
        '200':
          description: The group was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupExtended'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - BearerTokenAuth: []
        - 3-legged: []
  /groups/{id}/accounts/{authType}:
    get:
      tags:
        - Accounts
      summary: Get Group Account by Type
      description: Retrieves group account information by a specific type.
      operationId: getAccountByAuthType
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a group.
          required: true
          schema:
            type: string
        - in: path
          name: authType
          description: |-
            The account type to retrieve. Possible values:

            - ``ActiveDirectory`` - The account is backed by Active Directory.
            - ``Vault`` - The account is backed by Vault.
            - ``Autodesk`` - The account is backed by Autodesk ID.
          required: true
          schema:
            $ref: '#/components/schemas/AuthTypeEnum'
      responses:
        '200':
          description: The account was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /profile-attribute-definitions:
    get:
      tags:
        - Accounts
      summary: Get All Profile Attribute Definitions
      description: Retrieves all profile attribute definitions.
      operationId: getProfileAttributeDefinitions
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: query
          name: filter[association]
          description: |-
            The directory object types the profile attribute definition is associated with. Possible values:

            - ``User`` - Profile attribute definitions associated with users.
            - ``Group`` - Profile attribute definitions associated with groups.
            - ``All`` - Profile attribute definitions associated with both users and groups.
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The list of profile attribute definitions was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAttributeDefinitionCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /profile-attribute-definitions/{id}:
    get:
      tags:
        - Accounts
      summary: Get a Profile Attribute Definition
      description: Retrieves a profile attribute definition by its ID.
      operationId: getProfileAttributeDefinitionById
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a profile attribute definition.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The profile attribute definition was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileAttributeDefinition'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /roles:
    get:
      tags:
        - Accounts
      summary: Get User Roles
      description: |-
        Retrieves roles. The returned list depends on the permissions of the user passed in via BearerToken.
        If the user has AdminUserRead permission, all roles are returned.
        If not, only the roles that are assigned to the user are returned.
      operationId: getRoles
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The list of roles was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCollection'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /roles/{id}:
    get:
      tags:
        - Accounts
      summary: Get a User Role
      description: Retrieves a role by its ID.
      operationId: getRoleById
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a role.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The role was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: The role identifier is not valid or no role matches the supplied ``id``. Verify the role ID and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          description: The request was validated but your account does not have permission to read this role. Verify your credentials and permissions, then try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions:
    post:
      tags:
        - Auth
      summary: Create Session with Vault Credentials
      description: Creates a new session using the supplied user name, password, and Knowledge Vault name.
      operationId: createSession
      security: []
      x-codegen-request-body-name: body
      requestBody:
        description: The Vault credentials and the target Knowledge Vault for the sign-in request.
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  properties:
                    vault:
                      type: string
                      description: The Knowledge Vault to sign in to.
                    userName:
                      type: string
                      description: The Vault user name.
                    password:
                      type: string
                      description: The Vault password.
                    appCode:
                      type: string
                      description: The application name to use for server-side audit logging.
            examples:
              Example 1:
                value:
                  input:
                    vault: Vault
                    userName: administrator
                    password: ''
                    appCode: ''
        required: false
      responses:
        '200':
          description: The session was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: V:eyJUaWNrZXQiOiI1MjAzMWJkYy0yYzkzLTQ3NzItYjQ5Yy1hZjk4MjE2MDY1NzUiLCJVc2VySWQiOjJ9
                vaultInformation:
                  vaultName: vault
                  vaultId: '1'
                userInformation:
                  id: '2'
                  profilePicture: /default.png
                  userName: administrator
                  firstName: ''
                  lastName: Administrator
                  email: ''
        '400':
          $ref: '#/components/responses/400'
        '401':
          description: Sign-in was rejected. Verify the Knowledge Vault name, user name, and password, confirm the account is active, and try again. Review the response body ``errorCode`` and ``detail`` for more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                title: Vault error
                statusCode: 401
                errorCode: '8000'
                detail: login failed
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: The requested Knowledge Vault was not found. Verify the Knowledge Vault name or identifier and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                title: Vault error
                statusCode: 404
                errorCode: '133'
                detail: KnowledgeVaultDoesNotExist [133] (Vault)
  /sessions/win-auth:
    post:
      tags:
        - Auth
      summary: Create a Session with Windows Auth
      description: Creates a new session for the specified Knowledge Vault using the caller's Windows identity.
      operationId: createSessionWithWinAuth
      security: []
      x-codegen-request-body-name: body
      requestBody:
        description: The target Knowledge Vault for the Windows-authenticated sign-in request.
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  properties:
                    vault:
                      type: string
                      description: The Knowledge Vault to sign in to.
                    appCode:
                      type: string
                      description: The app name to use for server-side audit logging.
            examples:
              Example 1:
                value:
                  input:
                    vault: V1
                    appCode: TC
        required: false
      responses:
        '200':
          description: The session was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                accessToken: V:eyJUaWNrZXQiOiI1MjAzMWJkYy0yYzkzLTQ3NzItYjQ5Yy1hZjk4MjE2MDY1NzUiLCJVc2VySWQiOjJ9
                vaultInformation:
                  vaultName: vault
                  vaultId: '1'
                userInformation:
                  id: '2'
                  profilePicture: /default.png
                  userName: domain/user
                  firstName: ''
                  lastName: user
                  email: ''
        '400':
          $ref: '#/components/responses/400'
        '401':
          description: Windows authentication was rejected. Ensure you are signed in with a Vault-authorized Windows identity, that Windows authentication is enabled on the server, and that the Knowledge Vault name in the request body is correct, then try again.
        '403':
          $ref: '#/components/responses/403'
  /sessions/{id}:
    get:
      tags:
        - Auth
      summary: Get Current Session
      description: Retrieves the user session tied to Bearer token. Pass ``@current`` to retrieve the current active user session.
      operationId: getSessionById
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a login session.
          required: true
          schema:
            type: string
            default: '@current'
      responses:
        '200':
          description: The session was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    delete:
      tags:
        - Auth
      summary: Delete Current Session
      description: Deletes the user session tied to Bearer token. Pass ``@current`` to delete the current active user session.
      operationId: deleteSession
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a login session.
          required: true
          schema:
            type: string
            default: '@current'
      responses:
        '204':
          description: The session was successfully deleted.
          content:
            application/json:
              schema:
                type: object
                description: Status to check if session was deleted successfully.
              example: {}
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /system-options:
    get:
      tags:
        - Options
      summary: Get System Options
      description: Retrieves the list of options that apply to the entire system.
      operationId: getSystemOptions
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: query
          name: filter[name]
          description: The exact option name to match. Returns only system options whose name equals the supplied value.
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The list of system options was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultOptionCollection'
              examples: {}
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    post:
      tags:
        - Options
      summary: Create a System Option
      description: Creates a system option with the supplied name and value.
      operationId: createSystemOption
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the option.
                value:
                  type: string
                  description: The value of the option.
      responses:
        '200':
          description: The system option was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultOption'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          description: A system option with this name already exists. Choose a different name or update the existing option instead of creating a duplicate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /system-options/{id}:
    parameters:
      - in: path
        name: id
        description: The unique identifier of an option.
        required: true
        schema:
          type: string
    get:
      tags:
        - Options
      operationId: getSystemOptionById
      summary: Get a System Option
      description: Retrieves a system option by its ID.
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      responses:
        '200':
          description: The system option was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultOption'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
    patch:
      tags:
        - Options
      summary: Update a System Option
      description: Updates a system option by its ID.
      operationId: updateSystemOptionById
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: The new value of the system option.
      responses:
        '200':
          description: The system option was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultOption'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
    delete:
      tags:
        - Options
      summary: Delete a System Option
      description: Deletes a system option by its ID.
      operationId: deleteSystemOptionById
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      responses:
        '204':
          description: The system option was successfully deleted.
          content:
            application/json:
              schema:
                type: object
                description: The status of the delete operation.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /users:
    get:
      tags:
        - Accounts
      summary: Get All Users
      description: |-
        Retrieves the list of all users in the Knowledge Vault.

        The calling user must have AdminUserRead permission to call this operation.
      operationId: getAllUsers
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The list of users was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollection'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /users/{id}:
    get:
      tags:
        - Accounts
      summary: Get a User
      description: Retrieves the full user object associated with the specified ``id``.
      operationId: getUserById
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a user.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The user was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserExtended'
        '400':
          description: The user identifier in the request is missing or not valid. Verify the ``id`` URI parameter and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /users/{id}/accounts:
    get:
      tags:
        - Accounts
      summary: Get User Accounts
      description: Retrieves all accounts associated with the specified user ``id``.
      operationId: getUserAccounts
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a user.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The list of accounts was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCollection'
        '400':
          description: The user identifier in the request is missing or not valid. Verify the ``id`` URI parameter and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /users/{id}/accounts/{authType}:
    get:
      tags:
        - Accounts
      summary: Get a User Account
      description: Retrieves user account information for a specific type.
      operationId: getUsersAccountByAuthType
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: id
          description: The unique identifier of a user.
          required: true
          schema:
            type: string
        - in: path
          name: authType
          description: |-
            The account type to retrieve. Possible values:

            - ``ActiveDirectory`` - The account is backed by Active Directory.
            - ``Vault`` - The account is backed by Vault.
            - ``Autodesk`` - The account is backed by Autodesk ID.
          required: true
          schema:
            $ref: '#/components/schemas/AuthTypeEnum'
      responses:
        '200':
          description: The user account details were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: The user identifier in the request is missing or not valid. Verify the ``id`` URI parameter and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
  /vaults:
    get:
      tags:
        - Informational
      summary: Get All Knowledge Vaults
      description: Retrieves the list of all Knowledge Vaults on the server without requiring sign-in.
      operationId: getVaults
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursorState'
      responses:
        '200':
          description: The list of Knowledge Vaults was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultCollection'
              example:
                pagination:
                  limit: 2
                  totalResults: 3
                  nextUrl: /AutodeskDM/Services/api/vault/v2/vaults?limit=2&cursorState=SQBkAEMAdQByAHMAbwByAC0AdgAxADoAMQAwAA__
                results:
                  - name: vault1
                    id: '1'
                  - name: vault2
                    id: '2'
        '403':
          $ref: '#/components/responses/403'
  /vaults/{id}:
    get:
      tags:
        - Informational
      summary: Get a Knowledge Vault
      description: Retrieves a Knowledge Vault by its ID.
      operationId: getVaultById
      parameters:
        - in: path
          name: id
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Knowledge Vault details were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
              example:
                name: SelectValueName
                id: '1'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: The requested Knowledge Vault was not found. Verify the ``id`` URI parameter and try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /vaults/{vaultId}/change-orders:
    get:
      tags:
        - Change Orders
      summary: Get All Change Orders
      description: |-
        Retrieves a list of change orders matching the supplied filters and search criteria.

        The ``filter[assignees]`` query parameter is an additional filter that does not correspond to a property definition.
      operationId: getChangeOrders
      security:
        - BearerTokenAuth: []
        - 3-legged: []
      parameters:
        - in: path
          name: vaultId
          description: The unique identifier of a Knowledge Vault.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/q'
        - in: query
          name: filter[state]
